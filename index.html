<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🧊 笑話收藏器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#0d0d0d;color:#f0f0f0;font-family:'Noto Sans TC',system-ui,sans-serif;}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── HEADER ── */
#header{
  text-align:center;padding:12px 16px 10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:radial-gradient(ellipse at 50% 0%,rgba(255,225,53,.10) 0%,transparent 70%);
  flex-shrink:0;
}
#header h1{font-size:clamp(1.3rem,5vw,2rem);font-weight:900;color:#ffe135;letter-spacing:-1px;text-shadow:0 0 20px rgba(255,225,53,.2);}
#progress-wrap{max-width:360px;margin:8px auto 0;}
#progress-labels{display:flex;justify-content:space-between;font-size:0.72rem;color:#777;margin-bottom:3px;}
#progress-bar-bg{height:6px;background:#1e1e1e;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#ffe135,#ff8c00);border-radius:3px;transition:width .4s ease;box-shadow:0 0 8px rgba(255,200,0,.35);}
#tabs{display:flex;gap:8px;justify-content:center;margin-top:10px;}
.tab-btn{
  background:rgba(255,255,255,.04);color:#888;border:1px solid rgba(255,255,255,.08);
  border-radius:99px;padding:6px 18px;cursor:pointer;font-size:0.82rem;
  font-family:inherit;transition:all .15s;touch-action:manipulation;min-height:36px;
}
.tab-btn.active{background:#ffe135;color:#000;border-color:#ffe135;font-weight:700;box-shadow:0 2px 12px rgba(255,225,53,.3);}

/* ── RATE VIEW ── */
#rate-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:hidden;position:relative;}

/* 卡片容器 */
#card-area{width:100%;max-width:480px;position:relative;}

/* 卡片本體 */
#joke-card{
  background:linear-gradient(160deg,#1f1f1f,#181818);
  border:1px solid rgba(255,255,255,.07);border-radius:22px;
  padding:24px 20px;min-height:220px;
  display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;user-select:none;
  box-shadow:0 4px 24px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.04) inset;
  transition:transform .15s ease, box-shadow .15s ease;
  will-change:transform;
  touch-action:none;
}
#joke-card.swiping{transition:none;}
#joke-card.swipe-right{transform:translateX(120%) rotate(10deg);opacity:0;transition:transform .3s ease,opacity .3s ease;}
#joke-card.swipe-left{transform:translateX(-120%) rotate(-10deg);opacity:0;transition:transform .3s ease,opacity .3s ease;}

/* 滑動提示 */
#like-hint,#dislike-hint{
  position:absolute;top:20px;
  font-size:1.4rem;font-weight:900;opacity:0;
  transition:opacity .08s;pointer-events:none;
  padding:5px 12px;border-radius:8px;
  backdrop-filter:blur(4px);
}
#like-hint{right:16px;color:#4dff77;border:2.5px solid #4dff77;transform:rotate(10deg);text-shadow:0 0 10px rgba(77,255,119,.4);}
#dislike-hint{left:16px;color:#ff4d4d;border:2.5px solid #ff4d4d;transform:rotate(-10deg);text-shadow:0 0 10px rgba(255,77,77,.4);}

#cat-tag{
  display:inline-block;background:rgba(255,225,53,.12);color:#ffe135;
  font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:6px;
  margin-bottom:12px;letter-spacing:.5px;border:1px solid rgba(255,225,53,.18);
}
#src-tag{font-size:0.7rem;color:#666;margin-left:7px;}
#joke-q{font-size:clamp(0.95rem,2.5vw,1.08rem);line-height:1.8;white-space:pre-line;color:#e0e0e0;flex:1;}
#joke-a{
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,225,53,.12);
  color:#ffe135;font-weight:700;font-size:clamp(0.95rem,2.5vw,1.08rem);line-height:1.65;
  display:none;animation:fadeUp .2s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(prefers-reduced-motion:reduce){#joke-a,#joke-card.swipe-right,#joke-card.swipe-left{animation:none;transition:none;}}
#reveal-btn{
  margin-top:16px;background:rgba(255,225,53,.04);border:1px dashed rgba(255,225,53,.25);
  border-radius:12px;color:#777;padding:12px;cursor:pointer;font-family:inherit;
  font-size:0.88rem;width:100%;min-height:48px;
  transition:border-color .15s,color .15s,background .15s;touch-action:manipulation;
}
#reveal-btn:hover{border-color:rgba(255,225,53,.45);color:#aaa;background:rgba(255,225,53,.06);}
#reveal-btn:active{border-color:#ffe135;color:#ffe135;background:rgba(255,225,53,.08);}

/* 按鈕 */
#vote-btns{display:none;gap:12px;margin-top:14px;width:100%;max-width:480px;}
#vote-btns button{
  flex:1;padding:clamp(14px,3.5vw,20px);border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:clamp(1rem,3vw,1.3rem);border:1px solid transparent;
  transition:transform .12s,opacity .12s,box-shadow .12s;
  touch-action:manipulation;min-height:56px;
}
#vote-btns button:active{transform:scale(.93);opacity:.85;}
#btn-dislike{background:rgba(160,0,0,.2);border-color:rgba(200,0,0,.35);color:#ff5555;}
#btn-dislike:hover{background:rgba(160,0,0,.28);border-color:rgba(200,0,0,.5);}
#btn-like{background:rgba(0,140,0,.2);border-color:rgba(0,170,0,.35);color:#4dff77;}
#btn-like:hover{background:rgba(0,140,0,.28);border-color:rgba(0,170,0,.5);}

/* 滑動提示文字 */
#swipe-hint{
  font-size:0.72rem;color:#555;text-align:center;margin-top:10px;
}
#queue-status{font-size:0.75rem;color:#555;text-align:center;margin-top:8px;min-height:18px;}

/* 載入/空/錯誤 */
.center-msg{text-align:center;padding:40px 20px;}
.center-msg .emoji{font-size:2.5rem;margin-bottom:12px;}
.center-msg p{color:#aaa;line-height:1.8;font-size:0.92rem;}
#error-msg{color:#ff7070;}

/* ── COLLECTION VIEW ── */
#collection-view{flex:1;display:none;flex-direction:column;overflow:hidden;height:0;}
#rate-cats,#collection-cats{
  display:flex;gap:8px;padding:10px 16px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
#rate-cats::-webkit-scrollbar,#collection-cats::-webkit-scrollbar{display:none;}
.cat-filter{
  background:rgba(255,255,255,.04);color:#888;border:1px solid rgba(255,255,255,.08);
  border-radius:99px;padding:6px 16px;cursor:pointer;font-family:inherit;
  font-size:0.8rem;white-space:nowrap;flex-shrink:0;min-height:36px;
  touch-action:manipulation;transition:all .15s;
}
.cat-filter:active{opacity:.7;}
.cat-filter.active{background:#ffe135;color:#000;border-color:#ffe135;font-weight:700;box-shadow:0 2px 8px rgba(255,225,53,.25);}
#collection-grid{
  flex:1;overflow-y:auto;padding:0 16px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;
  align-content:start;
}
.joke-card-col{
  background:linear-gradient(160deg,#1e1e1e,#191919);
  border:1px solid rgba(255,255,255,.06);border-radius:14px;
  padding:14px;border-top:2px solid rgba(255,225,53,.25);
  transition:border-top-color .2s;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.joke-card-col.shared{border-top-color:rgba(100,200,100,.4);opacity:.72;}
.joke-card-col .jcat{font-size:0.72rem;color:#ffe135;font-weight:700;margin-bottom:7px;opacity:.85;letter-spacing:.3px;}
.joke-card-col .jq{font-size:0.9rem;color:#ccc;line-height:1.65;white-space:pre-line;margin-bottom:8px;}
.joke-card-col .ja{font-size:0.9rem;color:#ffe135;font-weight:700;line-height:1.55;margin-bottom:12px;}
.joke-actions{display:flex;gap:8px;margin-top:10px;}
.btn-copy,.btn-share{
  flex:1;padding:9px 10px;border-radius:10px;border:none;
  cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:700;
  transition:all .15s;touch-action:manipulation;min-height:40px;
}
.btn-copy{background:rgba(255,255,255,.05);color:#999;border:1px solid rgba(255,255,255,.1);}
.btn-copy:active,.btn-copy.copied{background:rgba(255,225,53,.07);color:#ffe135;border-color:rgba(255,225,53,.35);}
.btn-share{background:rgba(0,150,0,.08);color:#55cc55;border:1px solid rgba(0,150,0,.2);}
.btn-share.shared{background:rgba(0,120,0,.1);color:#44aa44;border-color:rgba(0,120,0,.3);}
.btn-share:active{opacity:.7;}
#no-collection{text-align:center;padding:60px 20px;color:#666;grid-column:1/-1;}
.share-filter{display:flex;gap:6px;padding:0 16px 10px;flex-shrink:0;}
.share-filter button{
  background:rgba(255,255,255,.04);color:#777;border:1px solid rgba(255,255,255,.08);
  border-radius:99px;padding:5px 14px;cursor:pointer;
  font-family:inherit;font-size:0.77rem;min-height:33px;touch-action:manipulation;
}
.share-filter button.active{background:rgba(255,255,255,.1);color:#eee;border-color:rgba(255,255,255,.18);}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <h1>🧊 笑話收藏器</h1>
    <div id="progress-wrap">
      <div id="progress-labels">
        <span id="liked-count">已收藏 0 則</span>
        <span>目標 1000 則</span>
      </div>
      <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    </div>
    <div id="tabs">
      <button class="tab-btn active" onclick="switchTab('rate')">⚡ 評分</button>
      <button class="tab-btn" id="tab-collection" onclick="switchTab('collection')">📚 收藏（0）</button>
    </div>
  </div>

  <!-- RATE -->
  <div id="rate-view">
    <div id="rate-cats"></div>
    <div id="loading-msg" class="center-msg">
      <div class="emoji">🧊</div>
      <p>從 Google Sheets 載入中…</p>
    </div>
    <div id="error-view" class="center-msg" style="display:none">
      <div class="emoji">❌</div>
      <p id="error-msg"></p>
    </div>
    <div id="card-area" style="display:none">
      <div id="like-hint">LIKE 😂</div>
      <div id="dislike-hint">NOPE 😐</div>
      <div id="joke-card">
        <div>
          <span id="cat-tag"></span><span id="src-tag"></span>
          <div id="joke-q"></div>
          <div id="joke-a"></div>
        </div>
        <button id="reveal-btn" onclick="revealAnswer()">點我看答案 👇</button>
      </div>
    </div>
    <div id="vote-btns">
      <button id="btn-dislike" onclick="vote(false)">😐 不好笑</button>
      <button id="btn-like" onclick="vote(true)">😂 好笑！</button>
    </div>
    <div id="swipe-hint">← 左滑不好笑　右滑好笑 →</div>
    <div id="queue-status"></div>
    <div id="empty-view" class="center-msg" style="display:none">
      <div class="emoji">📭</div>
      <p>這批評完了！<br>已收藏 <span id="empty-liked" style="color:#ffe135;font-weight:700">0</span> 則。<br><br>回去找 Claude 說「補下一批」，<br>他會再去網路搜一批新的！</p>
    </div>
  </div>

  <!-- COLLECTION -->
  <div id="collection-view">
    <div id="collection-cats"></div>
    <div class="share-filter">
      <button id="sf-all" class="active" onclick="setShareFilter('all')">全部</button>
      <button id="sf-unshared" onclick="setShareFilter('unshared')">未分享 ✨</button>
      <button id="sf-shared" onclick="setShareFilter('shared')">已分享 ✅</button>
    </div>
    <div id="collection-grid"></div>
  </div>

</div>

  { id:"g008", src:"痞客邦", cat:"地獄梗", q:"一位男士問禪師：「老婆對我專橫跋扈，情人卻是萬般體貼，該怎麼辦？」\n禪師淡淡說：", a:"「永遠不要相信在野黨，誰上台後，掌權都一樣。」" },
  { id:"g009", src:"痞客邦", cat:"地獄梗", q:"食人族酋長吩咐手下：「去抓幾個達官貴人來當晚餐。」\n手下：「平民百姓不行嗎？」\n酋長搖頭說：", a:"「味道不行，老百姓太苦了。」" },

  { id:"g013", src:"痞客邦", cat:"地獄梗", q:"面試時，主管問工作經歷。\n我答：「從事網路傳媒，社群企劃、時事新聞推廣，多次參與上萬人活動，時常和藝人、政治人物合作。」\n錄取後，同事問之前是做什麼的？\n我答：", a:"「在FB按讚分享。」" },
  { id:"g014", src:"痞客邦", cat:"地獄梗", q:"某甲問歐洲朋友：「整個歐洲文化語言都很類似，為什麼不乾脆組成一個國家？」\n德國人回答：", a:"「我們德國人上世紀努力了兩次，但大家的意願並不高。」" },

  { id:"g016", src:"痞客邦", cat:"地獄梗", q:"兩個餃子新婚之夜，公餃子送走賓客回洞房，發現床上有一個肉丸子，母餃子不見了。\n公餃子：「我的新娘去哪了？」\n肉丸子：", a:"「討厭，你不認得人家了？」（被人家揉圓了）" },
  { id:"g017", src:"PTT", cat:"地獄梗", q:"中華文化淵遠流長。唐代有詩，宋朝有詞，元代有曲，明清是小說，那麼民國以後最具代表性的是什麼書？", a:"參考書" },

  { id:"g031", src:"痞客邦", cat:"地獄梗", q:"有位老婆對男人說：「你走吧，我們不合適。」男人頓了頓說：「好。」\n老婆補了一刀：「你就這麼走了？都不問問我為什麼？」\n男人：", a:"「你說我們不合適，但你說話前問過我了嗎？」" },
  { id:"g032", src:"痞客邦", cat:"地獄梗", q:"老師：「小明，你的作文寫得很感人，你媽媽生病了，你哭了整晚。」\n小明：「老師……」\n老師：「我感動你能如此孝順。」\n小明：", a:"「我媽媽沒有生病，我是抄班上寫得最好的那個同學的。」" },

  { id:"x001", src:"PTT", cat:"地獄梗🔞", q:"上急救課，老師：「口對口人工呼吸，這樣重複做，會怎樣？」\n學生：", a:"「有人會告你性騷擾。」" },
  { id:"x002", src:"PTT", cat:"地獄梗🔞", q:"阿傑穿越墳場聽到敲擊聲，越來越響越來越怕，最後發現一個人在鑿石碑。\n阿傑：「謝天謝地，你在做什麼？」\n那人：", a:"「他們把我的名字刻錯了。」" },
  { id:"x003", src:"PTT", cat:"地獄梗🔞", q:"大老闆死後，天使讓他先去地獄待24小時再做選擇。地獄是狂歡派對，美食名酒美女帥哥，超爽。\n大老闆決定選地獄，一進去卻是一片荒原，朋友們全都在上刀山下油鍋。\n守門人說：", a:"「上次你是來面試的，現在你已經是員工了。」" },
  { id:"x004", src:"PTT", cat:"地獄梗🔞", q:"三個人死後打電話交代後事：外商講5分鐘要5萬，傳統企業講2分鐘要50萬，聯發科員工把公事交代了整整20小時，問閻王要多少錢？\n閻王說：「20元。」\n聯發科：「為什麼這麼便宜！？」\n閻王：", a:"「從地獄打到地獄是市內電話，只收基本費。」" },

  { id:"x007", src:"PTT", cat:"地獄梗🔞", q:"昨天晚上夢到一個惡夢，夢到我女朋友死了，醒了之後還傷心地啜泣，後來想想哭得更慘，因為……", a:"我根本沒有女朋友。" },
  { id:"x008", src:"PTT", cat:"地獄梗🔞", q:"我當臥底多年，今天被大哥識破了。因為大哥跟我去看電影，售票小姐問我：「買什麼票？」\n我說：", a:"「軍警票！」" },
  { id:"x009", src:"PTT", cat:"地獄梗🔞", q:"有個美女給我發Line說：「今晚來我家吧，我家沒人。」\n於是我去敲門，敲了一小時……", a:"果然沒人。" },
  { id:"x010", src:"PTT", cat:"地獄梗🔞", q:"昨天參加網友舉辦「三千人響應的放鴿子比賽」，最後結果……", a:"只有我一個人去。" },
  { id:"x011", src:"PTT", cat:"地獄梗🔞", q:"剛打電話約美女同事這週末看電影，沒想到她說不想看電影，想直接來看望我的家人！\n幸福來得太突然了……耳邊不時回想起她說的那句話：", a:"「看你媽啦！」" },
  { id:"x012", src:"PTT", cat:"地獄梗🔞", q:"老爸寫給老媽的英文情書：「I make early fuck every day, so that I can have strong body to protect you.」\n這句話的意思是？", a:"「我每天做早操，這樣我會有強壯的身體來保護你。」（早操＝early fuck）" },
  { id:"x013", src:"PTT", cat:"地獄梗🔞", q:"老爸英文情書：「Please come to eat and sleep with me, or I will cut my hair to be a monk.」\n翻譯是？", a:"「請嫁給我，否則我將削髮為僧。」（嫁＝和我吃住在一起）" },
  { id:"x014", src:"PTT", cat:"地獄梗🔞", q:"反韓風潮，三星電視、LG電視、現代汽車、泡菜都被驅逐，包心菜也在隊伍裡，泡菜問他：「你怎麼來了？」\n包心菜說：", a:"「他們說我是『高麗』菜……」\n後來巧克力也在，蔥問：「你跟韓國有什麼關係？」\n巧克力嘆氣說：「因為我……含果仁……」\n最後地瓜哭喪著臉說：「因為我是……韓籍（番薯）……」" },
  { id:"x015", src:"PTT", cat:"地獄梗🔞", q:"曾經願意為我犧牲生命的三個女人——\n年少時：「你再纏著我，我就去死！」\n外地時：「你想成為我男朋友，等下輩子吧！」\n窮困時：", a:"「你再不還我錢，我就與你同歸於盡！」" },
  { id:"x016", src:"PTT", cat:"地獄梗🔞", q:"有個男人偷情，回家後妻子嚴肅說：「你昨晚去哪了？」\n男：「跟朋友打麻將。」\n妻：「說謊！我打給那個女人了，她說你在她那。」\n男：", a:"「所以還是她比較誠實。」" },
  { id:"x017", src:"PTT", cat:"地獄梗🔞", q:"老師問：「如果你有十二顆糖，我向你要一半，你給我幾顆？」\n小明：「六顆。」\n老師：「很好，那如果你有十二個蘋果呢？」\n小明：「我不給。」\n老師：「為什麼？」\n小明：", a:"「因為我真的有十二個蘋果。」" },
  { id:"x018", src:"PTT", cat:"地獄梗🔞", q:"爸爸問兒子：「A跟B發生關係，B懷孕了，結果生了個C，請問誰是C的父親？」\n兒子不假思索：「A。」\n爸爸：「答錯了，是B的丈夫。」\n兒子看著爸爸說：", a:"「爸，那你懂的比我多耶。」" },
  { id:"x019", src:"PTT", cat:"地獄梗🔞", q:"男友說：「我最近工作壓力很大，夜晚常常睡不著，都在想你。」\n女友甜蜜地說：「真的嗎？你都在想我什麼？」\n男友：", a:"「你哪裡有介紹工作嗎？」" },
  { id:"x020", src:"PTT", cat:"地獄梗🔞", q:"某人去看醫生，醫生說：「你得了重病，只能再活三個月。」\n某人：「那我能怎麼辦？」\n醫生：「建議娶一個非常嘮叨的女人，然後搬到鄉下去住。」\n某人：「這樣能治好病？」\n醫生：", a:"「不能，但你會覺得三個月比三年還長。」" },
  { id:"x021", src:"PTT", cat:"地獄梗🔞", q:"警察問嫌疑人：「你昨晚十點在哪裡？」\n嫌疑人：「在家睡覺。」\n警察：「有人可以證明嗎？」\n嫌疑人：「有，我老婆。」\n警察：「有沒有其他人？」\n嫌疑人：", a:"「……有，我情人。」" },
  { id:"x022", src:"PTT", cat:"地獄梗🔞", q:"老師說：「人類的身體有60%是水。」\n小明：「老師，那剩下的40%是什麼？」\n老師：「其他元素。」\n小明：", a:"「那我喝水是在稀釋自己嗎？」" },
  { id:"x023", src:"PTT", cat:"地獄梗🔞", q:"法官問被告：「你承認你殺了那個人嗎？」\n被告：「承認。但法官大人，有一點請聽我解釋——」\n法官：「沉默！先回答yes or no！」\n被告：「YES。但……」\n法官：「好，你被判死刑。」\n被告的律師站起來說：", a:"「恭喜法官大人，你剛剛殺了全世界最好的外科醫生。被告是要解釋那個人其實已經快死了，他是在動手術。」" },
  { id:"x024", src:"PTT", cat:"地獄梗🔞", q:"小王問老王：「你老婆跟你在一起幸不幸福？」\n老王：「非常幸福！她說過一輩子都不離開我。」\n小王：「那你呢？」\n老王嘆氣：", a:"「所以我只好每天出門。」" },
  { id:"x025", src:"PTT", cat:"地獄梗🔞", q:"護士對醫生說：「有個病人說看到鬼，你要不要去看看？」\n醫生說：「不用，等他明天再來複診。」\n護士：「可是他說鬼在……」\n醫生：「我說不用就不用！」\n隔天護士說：「醫生，那個病人昨晚走了。」\n醫生：「果然是妄想症，好多了。」\n護士：", a:"「不是，他真的走了。鬼是在跟他說：『時間到了，跟我走。』」" },
  { id:"x026", src:"PTT", cat:"地獄梗🔞", q:"有人死後到天堂，天使帶他參觀，看到一排房間，每間房裡的鐘速度都不同。\n「這是什麼？」\n天使：「每個人撒謊一次，鐘就走快一格。」\n那人看了看問：「那台灣政治人物的鐘呢？」\n天使說：", a:"「喔，那個我們拿來當電風扇用。」" },
  { id:"x027", src:"PTT", cat:"地獄梗🔞", q:"老師：「你為什麼上課一直睡覺！」\n小明：「因為老師說話很小聲，我湊近想聽清楚。」\n老師：「那你幹嘛閉眼睛？」\n小明：", a:"「因為陽光太強，會刺眼。」" },
  { id:"x028", src:"PTT", cat:"地獄梗🔞", q:"小明問爸爸：「爸，精子和卵子是怎麼認識的？」\n爸爸正在想怎麼解釋……\n小明接著說：", a:"「算了我去問媽媽，她一定比你清楚。」" },
  { id:"x029", src:"PTT", cat:"地獄梗🔞", q:"女：「如果我和你媽同時掉進河裡，你先救誰？」\n男沉默了很久。\n女：「你為什麼不說話！」\n男：", a:"「我在等你們其中一個先沉下去，這樣就不用選了。」" },
  { id:"x030", src:"PTT", cat:"地獄梗🔞", q:"有個人第一次搭飛機很緊張，旁邊的空姐安慰：「別緊張，統計上，你在路上被車撞死的機率比飛機失事高多了。」\n男人回去後決定開車上班。\n結果當天就被車撞死了。\n天堂裡上帝說：", a:"「這怪不了統計數字。」" },

  { id:"w005", src:"痞客邦", cat:"地獄梗", q:"我問禪師：「我本來就黑，一到夏天曬得更黑，別人取笑我，該怎麼辦？」\n大師悠悠地把寺廟門打開，讓陽光投射進來。\n我：「大師要我打開心扉，不在乎別人看法，對嗎？」\n禪師：", a:"「不，老衲只是想看清楚，施主您到底在哪？」" },
  { id:"w006", src:"痞客邦", cat:"地獄梗", q:"「笑」和「話」是好朋友，有一天「笑」死掉了，「話」跪在他墳墓旁哭著說：", a:"「嗚……我好想笑喔……」" },

  { id:"w008", src:"痞客邦", cat:"地獄梗", q:"一名工程師40出頭過世，到天堂見上帝。\n工程師：「為什麼我如此年輕就死了？」\n上帝：", a:"「根據你的工時填報，你已經120歲了。」" },
  { id:"w009", src:"痞客邦", cat:"地獄梗", q:"老師發考卷喊「朱肚皮」，沒人回應；又叫「木棍」，沒人回應。最後剩兩位學生。\n老師：「你們就是朱肚皮跟木棍？」\n學生：", a:"「我是朱月坡，他是林昆。」" },
  { id:"w010", src:"痞客邦", cat:"地獄梗", q:"飛機即將失事，5人只有4個降落傘。駕駛先跳、總統說不能死也跳、校長說最重要也跳。\n只剩一個，牧師對學生說：「孩子，你拿去吧，我離天堂比較近。」\n學生回：", a:"「放心，還有兩個，校長剛剛背著我的書包跳下去了。」" },
  { id:"w011", src:"痞客邦", cat:"地獄梗", q:"警方在機場行李帶的行李箱裡查獲一具瘦得皮包骨的男屍，警方非常不解，法醫趕到後說：", a:"「這是迴轉瘦屍。」" },
  { id:"w012", src:"痞客邦", cat:"地獄梗", q:"教授和農民賭題，農民問：「上山三條腿，下山四條腿，是什麼？」教授苦思無解給了500元，再追問答案是什麼。\n農民……", a:"一言不發，又遞給教授5元，然後睡覺。" },
  { id:"w013", src:"痞客邦", cat:"地獄梗", q:"秦朝記者招聘：請報導焚書坑儒。甲說暴政當道被罵，乙說今日休刊被搖頭。丙說：", a:"「營火晚會意外，三百儒生遇難，大量古籍被毀，吾皇親赴救災！」\n考官拍桌：靠！人才。" },
  { id:"w014", src:"痞客邦", cat:"腦筋急轉彎", q:"什麼東西可以同時巴大家的頭？", a:"唐宋古文" },
  { id:"w015", src:"痞客邦", cat:"腦筋急轉彎", q:"被什麼鬼附身會讓人單身一輩子？", a:"酉鬼（醜鬼）" },
  { id:"v001", src:"痞客邦", cat:"地獄梗", q:"永澤對小丸子說：「你很卑鄙耶！不信你去問別人。」\n小丸子跑去找花輪：「花輪，我卑鄙嗎？」\n花輪：", a:"「嘿！baby～」（Hey baby＝卑鄙）" },
  { id:"v002", src:"痞客邦", cat:"地獄梗", q:"看畫展時問導覽員：「這是米勒拾穗的畫嗎？」\n導覽員搖搖頭說：", a:"「這是他四十三歲的畫。」" },
  { id:"v003", src:"痞客邦", cat:"腦筋急轉彎", q:"一學生名字叫馬騳驫。語文老師點名：萬馬奔騰到了沒？生物老師：一群馬到了沒？數學老師：六隻馬到了沒？\n歷史老師：", a:"「馬家的五馬分屍來了沒有？」" },
  { id:"v004", src:"痞客邦", cat:"地獄梗", q:"河神手上拿著金小明和銀小明，阿嬤衝過來：「挖ㄟ金孫啊啊啊！！」\n女神：「妳太貪心了。」\n（噗通）", a:"阿嬤被推進河裡了。" },

  { id:"v006", src:"痞客邦", cat:"短故事", q:"老師：又遲到！用一句成語說明現在的情況，說得好就不罰。\n學生：", a:"「相見恨晚。」" },
  { id:"v007", src:"痞客邦", cat:"短故事", q:"小明和小華晚上去墓仔埔試膽，聽到極為淒厲的哀嚎聲。\n小明壯起膽子大聲說：「到底是誰一直在哀啦！」\n鬼：", a:"「死了～都要哀～～～～～」" },
  { id:"v008", src:"痞客邦", cat:"地獄梗🔞", q:"美女正在洗澡。軍人敲門說升將軍、老師敲門說升主任，她都包著浴巾開門恭喜。\n接著四樓的瞎子來敲門，美女從貓眼看到是瞎子，懶得包浴巾就開門了。\n瞎子說：", a:"「恭喜我吧！我重見光明了！」" },
  { id:"v009", src:"痞客邦", cat:"地獄梗", q:"建商死後，先參觀天堂（冷清）再參觀地獄（同行朋友喝酒唱歌有辣妹），他選了地獄，進去後立刻被上刀山下油鍋。\n建商向閻王申訴：「為什麼和我參觀時完全不一樣？」\n閻王：", a:"「虧你自己是建商還搞不懂狀況，你那天參觀的是樣品屋。」" },
  { id:"v010", src:"痞客邦", cat:"地獄梗", q:"一個仲介死後下地獄，把小鬼們全激勵了，天天開晨會講夢想跳團隊舞，閻王滿頭大汗跑去天堂告狀，上帝把他調上天堂。一個月後閻王問戰況如何，上帝停下說：", a:"「你犯了三個錯。第一，叫我經理！第二，這世界沒有上帝，只有客戶才是上帝！第三，我沒空和你閒扯，我要去做每日工作報表了。」" },

  { id:"z002", src:"痞客邦", cat:"短故事", q:"老闆唱KTV唱得正盡興，小明突然手殘按到「切歌」。\n空氣瞬間凝結，大家面面相覷。\n小明：", a:"「我以為是導唱，沒人唱，所以就切了。」" },
  { id:"z003", src:"痞客邦", cat:"短故事", q:"胡瓜去科技公司面試。\n主管：你懂製程嗎？\n胡瓜：不是，我胡瓜。\n\n換董至成來面試。\n主管：你懂製程嗎？\n董至成：是。\n主管：你懂什麼？\n董至成：志成。\n主管：什麼製成？\n董至成：董。\n主管：", a:"來，下一位。" },

  { id:"z006", src:"痞客邦", cat:"短故事", q:"記者訪問女星：「聽說你一天只睡三小時，那你大部分時間都在做什麼呢？」\n女星：", a:"「打瞌睡。」" },
  { id:"z007", src:"痞客邦", cat:"短故事", q:"《英雄救美篇》\n若英雄貌似潘安，美女笑回：「小女子無以為報，唯有以身相許。」\n若英雄貌似八戒，美女含淚躬身：", a:"「小女子無以為報，唯有來世做牛做馬報此大恩……」" },
  { id:"z008", src:"痞客邦", cat:"短故事", q:"魔王抓走公主說：「你盡管叫破喉嚨吧！沒有人會來救妳的！」\n公主：「破喉嚨～破喉嚨～」\n沒有人：「公主～我來救妳了！」\n魔王：「說曹操曹操就到！」\n曹操：「魔王！你叫我幹嘛？」\n魔王：「哇勒！看到鬼！」\n鬼：「靠！被發現了！」\n靠：「胡說！誰發現我了？」\n誰：「關我屁事？」\n魔王：「oh～my God！」\n上帝：「誰叫我？」\n誰：「沒有人叫你啊！」\n沒有人：「我哪有？」\n魔王……", a:"從此得了精神分裂症。" },

  { id:"iv003", src:"痞客邦", cat:"短故事", q:"化工所A打電話給B：「都幾點了，你還在實驗室，要不要回去睡了？」\nB：「不行，我在忙！」\nA：「什麼事？」\nB：", a:"「我在鍍鈷。」（我在度過）" },
  { id:"iv004", src:"痞客邦", cat:"短故事", q:"孔子的弟子顏淵曾感嘆：「仰之彌高，鑽之彌堅；瞻之在前，忽焉在後。」\n用現代話翻譯，這是在描述孔子……", a:"打籃球。「好高大的中鋒！防守好堅固！剛在前面，怎麼跑後面了！」" },
  { id:"iv005", src:"痞客邦", cat:"短故事", q:"洗碗阿姨自命不凡，給自己取名叫瓷洗太后（慈禧太后）。補車胎師傅取名拿破輪，電焊工取名焊武帝。兩人去糖果店炫耀，老闆遞出名片：糖太宗，兩人沉默。經過蛋糕店，門牌：漢糕祖，兩人更沉默。這時一個掏糞工騎著拉糞車經過……", a:"車上寫著：擒屎皇（秦始皇）" },
  { id:"iv006", src:"痞客邦", cat:"短故事", q:"神父在海關被問：「你有什麼要申報的嗎？」\n神父：「由我的頭到我的腰，我都沒有什麼可以申報。」\n官員：「那腰部以下呢？」\n神父：", a:"「我有一個精巧的小器具，女人專用的，但還沒用過。」\n（他幫乘客藏了一台除毛器）" },
  { id:"iv007", src:"痞客邦", cat:"短故事", q:"重考生小明邊走路邊背英文單字，突然被車撞飛住院。\n爸媽趕到，著急問他：「醫生怎麼說？」\n小明虛弱地說：", a:"「Do…Doctor…」" },
  { id:"iv008", src:"痞客邦", cat:"短故事", q:"跟同學去夜唱，本人歌喉不錯，唱完後大家熱烈拍手，高喊「幫我簽名！幫我簽名！」\n結果隔天早上……", a:"經濟學只有我到，幫大家簽名。" },
  { id:"iv009", src:"痞客邦", cat:"短故事", q:"古代皇后在位時很愛她的床。\n有個老外學了10年漢語，來台參加考試，題目是解釋：\n「冬天：能穿多少穿多少；夏天：能穿多少穿多少。」\n老外……", a:"淚流滿面，交白卷回國了。" },
  { id:"iv010", src:"痞客邦", cat:"短故事", q:"老外又苦練10年再來挑戰，題目：請解釋每個「意思」的意思。\n長官說：「你這是什麼意思？」\n阿呆說：「沒什麼意思，意思意思。」\n長官說：「你這就不夠意思了。」\n阿呆說：「小意思，小意思。」……老外又淚流滿面回國了。", a:"（一段對話裡「意思」有多種不同意思）" },
  { id:"iv011", src:"痞客邦", cat:"腦筋急轉彎", q:"古代專門閹割太監的地方叫什麼？", a:"檢調單位。" },
  { id:"iv012", src:"痞客邦", cat:"腦筋急轉彎", q:"課被當了，猜一句成語？", a:"重修舊好。" },
  { id:"iv013", src:"痞客邦", cat:"腦筋急轉彎", q:"哈士奇被結紮時說了什麼？", a:"割本哈根？（哥本哈根）" },

  // ── 西施問路 笑話I精選 ──────────────────────────────────
  { id:"i001", src:"痞客邦", cat:"短故事", q:"烏龜生病，蝸牛去探望。烏龜託蝸牛去買藥，過了很久蝸牛還沒買回來，烏龜很生氣說：「到底在搞什麼！等他回來，我就死了」\n門口忽然傳來一句話：", a:"「你再罵，我就不去了。」" },
  { id:"i002", src:"痞客邦", cat:"短故事", q:"烏龜改叫蜈蚣去買藥，一樣很久沒回來，烏龜又開罵：「腳比較多應該很快，怎麼也那麼慢？」\n此時門外傳來蜈蚣的聲音：", a:"「偶還在穿鞋啦！」" },
  { id:"i003", src:"痞客邦", cat:"短故事", q:"蒼蠅一家以大便為主食，弟弟問哥哥：「為什麼每次吃飯都要吃大便？」\n哥哥說問媽媽。媽媽聽了瞪了兩兄弟一眼說：", a:"「呸呸呸，吃飯的時候不要講這個！」" },
  { id:"i004", src:"痞客邦", cat:"短故事", q:"小壁虎遇到大鱷魚要吃牠，情急之下抱住鱷魚腿大喊：「媽媽！」\n大鱷魚一愣，立即老淚縱橫：", a:"「可憐的孩子，你怎麼瘦成這樣了！」" },
  { id:"i005", src:"痞客邦", cat:"短故事", q:"路人甲：「你瞧，在溜滑梯的小孩實在看不出是男生還是女生。」\n路人乙：「男生，他是我兒子。」\n路人甲：「對不起，我不知道你是他爸爸。」\n路人乙：", a:"「不！我是他媽媽。」" },
  { id:"i006", src:"痞客邦", cat:"短故事", q:"老師問小新：「你的毛病是用詞不當，現在用成語形容老師很開心？」\n小新答：", a:"「含笑九泉。」" },
  { id:"i007", src:"痞客邦", cat:"短故事", q:"小海馬在海裡游，看到一個白色的東西，問：「你是什麼東西？」\n那個不明生物回答：「我是龍。」\n一百年後，大海馬又遇到牠，問：「你為什麼都沒長大？」\n龍說：", a:"「因為我是保麗龍。」" },
  { id:"i008", src:"痞客邦", cat:"短故事", q:"蔣幹打電話給曹操：\n蔣幹：「操你嗎？我幹！」\n曹操：「我操，你誰啊？」\n蔣幹：「我幹啊！」\n曹操：「我操，你到底是誰啊？」\n……此時蔣幹的媽媽接過電話：", a:"「我幹他媽啊，你操吧？操你媽呢？」" },
  { id:"i009", src:"痞客邦", cat:"短故事", q:"漂亮媽媽抱著新生兒在車站哭泣，因為女兒沒遺傳她的美貌。\n站長安慰說：「先坐一下，我去給妳倒杯茶。」\n回來時說：", a:"「這杯茶給妳，這根香蕉是給妳猴子的。」" },
  { id:"i010", src:"痞客邦", cat:"短故事", q:"烏鴉媽媽病了，小烏鴉說：「媽媽，請快點好起來，不要離開我。」\n母親感動地說：「親愛的孩子，如果你不是烏鴉嘴多好啊，媽媽是真不想離開你啊。」\n次日……", a:"烏鴉媽媽，卒。" },
  { id:"i011", src:"痞客邦", cat:"短故事", q:"小明請假，老師問為什麼。\n小明：「要做手術。」\n老師：「什麼手術？」\n小明：「人體無神經組織切除手術。」\n老師：「說人話！」\n小明：", a:"「剪頭髮。」" },
  { id:"i012", src:"痞客邦", cat:"短故事", q:"老師：「丁一，你為什麼總是不守紀律，罰抄名字20遍！你看人家爨龘龗坐得多乖！」", a:"（丁一的名字只有兩字，爨龘龗抄一次就等於抄了好幾十劃）" },
  { id:"i013", src:"痞客邦", cat:"短故事", q:"唐僧取經回北京，才下飛機。記者問：「你對三陪小姐有何看法？」唐僧：「北京也有三陪小姐？」\n記者第二天登報：", a:"《唐僧飛抵北京，開口便問有無三陪》\n（唐僧回答什麼都被扭曲報導，最後為了三陪案撞牆而死，媒體補報：「為了三陪而殉情：唐僧的這一生。」）" },
  { id:"i014", src:"痞客邦", cat:"地獄梗", q:"川普和金正恩肚子很餓進了麵包店，身上沒錢。金正恩趁老闆不注意拿了三塊麵包，說：「我多聰明，老闆什麼都沒看到。」\n川普說：「用誠實的方式也能辦到，看我的！」\n川普跟老闆說要變魔術，老闆好奇給了三塊麵包，川普全吃了。\n老闆問：什麼時候才開始變魔術？\n川普說：", a:"「現在是見證奇蹟的時刻！剛才的三塊麵包，都在金正恩的口袋裡。」" },

  // ── 新識界 冷笑話地獄梗精選 ────────────────────────────
  { id:"n001", src:"網路", cat:"地獄梗", q:"老奶奶跟洗髮精有什麼共通點？", a:"都常倒在浴室地板。" },
  { id:"n002", src:"網路", cat:"地獄梗", q:"耶穌為什麼不能打籃球？", a:"因為他被盯的很緊。" },
  { id:"n003", src:"網路", cat:"地獄梗", q:"殘障人士生的小孩要怎麼稱呼？", a:"蠶寶寶（殘寶寶）" },
  { id:"n004", src:"網路", cat:"地獄梗", q:"跌到谷底的時候要去哪裡？", a:"養老院，因為有很多翻身的機會。" },
  { id:"n005", src:"網路", cat:"地獄梗", q:"希特勒最喜歡玩什麼？", a:"桌遊（捉猶）" },
  { id:"n006", src:"網路", cat:"地獄梗", q:"大寫的英文字母有幾個？", a:"25個，因為大S沒了。" },
  { id:"n007", src:"網路", cat:"地獄梗", q:"全台灣誰最努力賣玻璃？", a:"黃鴻升，因為他主動賣玻璃（主動脈剝離）" },
  { id:"n008", src:"網路", cat:"地獄梗", q:"為什麼大人都教小朋友手濕濕的不能碰插座？", a:"因為怕他們早熟。" },
  { id:"n009", src:"網路", cat:"地獄梗", q:"士兵在戰場殺敵殺了3天，一槍放倒一個，一眼都沒有扎過！", a:"這麼長時間不扎眼睛，會不會乾啊？" },
  { id:"n010", src:"網路", cat:"短故事", q:"賣女孩的小火柴：「有沒有人要買小女孩？」\n大叔們：", a:"「我！我！我要買！」" },
  { id:"n011", src:"網路", cat:"短故事", q:"熊大：「你有洗澡嗎？」\n兔兔：「有啊，真的有啦！」\n然後……", a:"兔兔就被熊大抓去擦屁股了。" },
  { id:"n012", src:"網路", cat:"腦筋急轉彎", q:"有的筆叫原子筆，有的筆叫鉛筆，但是沒有筆叫什麼？", a:"沒有傷害。（沒有筆→沒有傷害）" },
  { id:"n013", src:"網路", cat:"腦筋急轉彎", q:"個性悶的人生悶氣；個性直的人生直氣；個性溫和的人呢？", a:"生薑（生薑氣？溫和→薑→薑氣）不對，答案是：生薑（溫→溫熱→薑是溫性）" },
  { id:"n014", src:"PTT", cat:"地獄梗", q:"上班不要看少了：阿傑、湯瑪、關關、蔡哥，後剩下誰啊？", a:"剩下誰？（這些都是台灣社會案件受害者的諧音或直稱）" },

  // ── 西施問路笑話I額外補充 ──────────────────────────────
  { id:"i015", src:"痞客邦", cat:"腦筋急轉彎", q:"牧場主人對牛說：「今天你就自己擠牛奶吧！」\n牛就回他說：", a:"「我真是自取其乳（辱）啊！」" },
  { id:"i016", src:"痞客邦", cat:"短故事", q:"有次跟大學同學去夜唱，因為本人歌喉不錯，唱完後大家熱烈拍手叫好，並且每個人都高喊：「幫我簽名！幫我簽名！」\n結果隔天早上，經濟學只有我到……", a:"並且幫大家簽名。" },
  { id:"i017", src:"PTT", cat:"腦筋急轉彎", q:"芥末走在路上，被路人打了一巴掌。\n路人：「你不是很嗆？」\n芥末：「你幹嘛打我？」", a:"（芥末被打→打芥末→打嗝沫？→芥末被嗆→you嗆我？）核心是路人覺得芥末嗆所以打它" },
  { id:"i018", src:"痞客邦", cat:"短故事", q:"有一天，大魚問小魚：「你知道魚的記憶力只有三秒嗎？」\n小魚：「真的假的！？」\n大魚：", a:"「什麼真的假的？」（大魚已經忘了自己剛說什麼）" },

  // ── PTT haiduc 短笑話N篇（2022）────────────────────────
  { id:"hd001", src:"PTT", cat:"地獄梗🔞", q:"哥釣的不是魚……", a:"割掉的是包皮" },
  { id:"hd002", src:"PTT", cat:"短故事", q:"有一天晚上我設了一個鬧鐘……", a:"然後鬧鐘就懷孕了。（設了個警報→鬧中→鬧）" },
  { id:"hd003", src:"PTT", cat:"短故事", q:"老師問風紀股長：「有沒有應到的未到？」\n風紀大力地吸了兩口氣回答：", a:"「沒聞到。」（聞到→問到）" },
  { id:"hd004", src:"PTT", cat:"短故事", q:"自從小文交了男友之後就……", a:"變成小六了。（交了→六了）" },
  { id:"hd005", src:"PTT", cat:"短故事", q:"有一天早上小霖起床去照鏡子，他就發現自己變成了……", a:"陳柏霖。（小霖→陳柏霖）" },
  { id:"hd006", src:"PTT", cat:"地獄梗🔞", q:"路邊來了一台捐精車，後來有一位小姐上車了。\n工作人員：「小姐，我們這是捐精車，要請妳下車喔。」\n小姐努力講出一句話：", a:"「那我嘴裡的怎麼辦？」" },
  { id:"hd007", src:"PTT", cat:"短故事", q:"小白兔跟大象很久沒見面了，一見面就問：「大象，近來好嗎？」", a:"白兔卒。（大象→象→像→一見如「故」→一問就沒了）" },
  { id:"hd008", src:"PTT", cat:"腦筋急轉彎", q:"為什麼數學老師的第一個小孩都是女生啊？", a:"因為他都先設X再設Y。" },
  { id:"hd009", src:"PTT", cat:"短故事", q:"有一天牙籤看到刺蝟……", a:"牙籤：公車耶！（刺蝟身上都是牙籤）" },
  { id:"hd010", src:"PTT", cat:"短故事", q:"毛利小五郎在台上致詞，小蘭站在他旁邊。\n臺下的柯南發現有人要狙擊小蘭！\n柯南大喊：「小蘭趴下來！」\n然後……", a:"毛利小五郎就默默下台了。（爸爸聽到「趴下來」…）" },
  { id:"hd011", src:"PTT", cat:"短故事", q:"小時候：\n小美：哈囉\n小明：哈囉\n長大後：\n小美：哈囉\n小明：", a:"好啊。（哈囉→好啊）" },
  { id:"hd012", src:"PTT", cat:"短故事", q:"小明跟小美在沙漠遇到神燈，各許一個願望。\n小明：「我想要變聰明。」→得到聰明丸。\n小美：「我想要長高丸。」\n於是……", a:"小美就變成了男生。（長高丸→長根丸→長了）" },
  { id:"hd013", src:"PTT", cat:"短故事", q:"小千跟小北是一對情侶，到了晚上……", a:"他們變成了小乖。（千+北=乖）" },
  { id:"hd014", src:"PTT", cat:"短故事", q:"小美：「你知道路邊的傳單跟你有什麼共通點嗎？」\n小明：「不知道。」\n小美：", a:"「印了也沒有人要看啦。」" },
  { id:"hd015", src:"PTT", cat:"地獄梗🔞", q:"妹妹：「媽咪，為什麼我下面長毛？」\n媽媽：「因為你下面長了一隻小猴子呀。」\n妹妹跑去跟姐姐炫耀自己有小猴子。\n姐姐：", a:"「哼！你那算什麼，我的猴子早就吃過香蕉了。」" },
  { id:"hd016", src:"PTT", cat:"地獄梗🔞", q:"小明：「爸爸，你在樓上幹什麼？下樓教我數學啊！」\n爸爸：", a:"「媽媽啊。」" },
  { id:"hd017", src:"PTT", cat:"短故事", q:"男：Are you free tonight?\n女：", a:"No, but I'm cheap." },
  { id:"hd018", src:"PTT", cat:"腦筋急轉彎", q:"為什麼房間的英文叫做room？", a:"因為……啊……喔……喔……嗯。（room的發音）" },
  { id:"hd019", src:"PTT", cat:"短句梗", q:"大風一吹～\n鳥：", a:"我巢吹了。（我超吹了）" },
  { id:"hd020", src:"PTT", cat:"短句梗", q:"從前有個太監……", a:"下面沒有了。" },
  { id:"hd021", src:"PTT", cat:"地獄梗🔞", q:"男：「想不想聽一個有關我老二的故事？」\n男：「算了，太長了我不想說。」", a:"（欲言又止，強調「太長了」）" },
  { id:"hd022", src:"PTT", cat:"地獄梗🔞", q:"女：「想不想聽一個關於我陰道的故事？」\n女：「算了，太深了你聽不懂！」", a:"（同上反版）" },

  // ── PTT haiduc 笑話數則（2022）────────────────────────
  { id:"hd023", src:"PTT", cat:"短故事", q:"小美問小明：「你們家是開什麼的？」\n小明：「我爸開賓士，我媽開特斯拉。」\n小美：「哇！那你開什麼？」\n小明：", a:"「我開玩笑。」" },
  { id:"hd024", src:"PTT", cat:"短故事", q:"小明怕iPhone被偷在藏手機。\n小華：「為什麼要把手機藏起來？」\n小明：「我在實踐今天老師教的道理——『機不可失』，所以我要守護好手機！」", a:"（機不可失→手機不可失）" },
  { id:"hd025", src:"PTT", cat:"短故事", q:"有三個人到早餐店點荷包蛋。\n甲：「我的蛋不要蛋黃。」\n乙：「我的蛋不要蛋白。」\n老闆不耐煩問丙：「你的蛋不要什麼？」\n丙：", a:"「我不要蛋殼！」" },
  { id:"hd026", src:"PTT", cat:"短故事", q:"老師教小朋友：「弄丟了東西要報告老師。」\n有小朋友馬上舉手。\n老師：「你弄丟了什麼？」\n小朋友：", a:"「媽媽說我都『丟三落四』。」" },
  { id:"hd027", src:"PTT", cat:"短故事", q:"老師指責值日生：「垃圾沒倒，黑板沒擦，打掃工具亂放……地球儀也全是灰塵！」\n值日生：", a:"「報告老師，您摸的地方正是戈壁沙漠。」" },

  { id:"fs003", src:"痞客邦", cat:"腦筋急轉彎", q:"誰的微積分最爛？", a:"孔子，因為他知其不可為而為之。（不可為→不可微分）" },
  { id:"fs004", src:"痞客邦", cat:"腦筋急轉彎", q:"為什麼化學老師上有機化學時一直道歉？", a:"因為他在說烯類（說sorry）" },
  { id:"fs005", src:"痞客邦", cat:"腦筋急轉彎", q:"某天大甲溪向大肚溪告白，大肚溪拒絕了。\n大甲溪：「為什麼？難道我不夠好嗎？」\n大肚溪：", a:"「因為……我們不是河。」（不是一家人）" },
  { id:"fs006", src:"痞客邦", cat:"腦筋急轉彎", q:"孔明：「魯肅啊，近來可好？」\n魯肅：「別來無恙。」\n孔明：「魯夫人呢？」\n魯肅：", a:"「他現在應該在偉大的航道上。」（魯夫人→路飛人→航海王）" },
  { id:"fs007", src:"痞客邦", cat:"腦筋急轉彎", q:"有一天周武王不能講話變成啞巴，他會變成誰？", a:"羅志祥，因為啞周武王。（啞周→亞洲→亞洲舞王）" },
  { id:"fs008", src:"痞客邦", cat:"短故事", q:"孫權手下甘興不小心把孫權心愛的桌子割了一痕，孫權要處死他。\n周瑜想到妙計救了他，下令全國割東西前先在桌上墊張紙……\n這就是……", a:"全國墊紙救甘興的由來。" },
  { id:"fs009", src:"痞客邦", cat:"短故事", q:"老師要找李弘毅同學，但忘記他的班級，在走廊隨問個人：「同學，李弘毅幾班？」\n同學：", a:"「DAIKIN！」（大金冷氣，台語：大金→大幾班→幾班？）" },
  { id:"fs010", src:"痞客邦", cat:"腦筋急轉彎", q:"以前有個食客不小心撞見皇上和妃子洞房，於是他就變成了……", a:"見朕騎姬的食客（千與千尋）" },

  { id:"fs012", src:"痞客邦", cat:"腦筋急轉彎", q:"楊丞琳、蔡依林、王若琳一起去潛水，過了很久只有楊丞琳跟蔡依林浮起來，為什麼？", a:"因為若琳 in the deep。" },
  { id:"fs013", src:"痞客邦", cat:"短故事", q:"皮卡丘忘了帶學生證，站在宿舍門口外難過地說：「皮卡皮卡～」\n傑尼龜走過來說：", a:"「借你借你～」（傑尼=借你）" },

  { id:"fs019", src:"痞客邦", cat:"腦筋急轉彎", q:"把家裡幫傭鎖起來，猜一個國家？", a:"索馬利亞（鎖嘛莉呀）" },
  { id:"fs020", src:"痞客邦", cat:"短故事", q:"有一天，有個外國人搭了我的肩膀問：「請問這裡是台北嗎？」\n我回：", a:"「不，這是我的肩膀。」" },
  { id:"fs021", src:"痞客邦", cat:"腦筋急轉彎", q:"易經他媽媽是誰？", a:"液晶螢幕（液晶→Yi-Jing→易經生了液晶）" },
  { id:"fs022", src:"痞客邦", cat:"腦筋急轉彎", q:"為什麼刺蝟有很多小孩？", a:"因為他背上很多刺（很多時）" },

  { id:"fs026", src:"痞客邦", cat:"短故事", q:"醫生問小明：「如果把你一邊耳朵割掉你會怎樣？」\n小明：「我會聽不見。」\n「那再割掉另一個耳朵呢？」\n小明：「我會看不見。」\n為什麼？", a:"因為眼鏡會掉下來。" },
  { id:"fs027", src:"痞客邦", cat:"腦筋急轉彎", q:"大幾的暑假要早起？", a:"大一（Wake up！你是大一暑假）" },
  { id:"fs028", src:"痞客邦", cat:"短故事", q:"中華文化淵遠流長。唐代有詩，宋朝有詞，元代有曲，明清是小說，那麼民國以後最具代表性的是什麼書？", a:"參考書。" },
  { id:"fs029", src:"痞客邦", cat:"短故事", q:"阿哲問阿明：「我爸爸在公車上會讓座，你爸會嗎？」\n阿明：「不可能！」\n阿哲以為阿明爸爸真厚臉皮，阿明接著說：", a:"「因為我爸爸是公車司機。」" },
  { id:"fs030", src:"痞客邦", cat:"短故事", q:"爸爸罵兒子：「你為什麼天天在學校打架！」\n兒子：「我沒有啊！」\n爸爸更生氣：「你還裝傻！導師已經跟我說了：」", a:"「你都和同學打成一片！」" },

  { id:"kl015", src:"痞客邦", cat:"短故事", q:"警察對出車禍的機車騎士說：「請問你叫什麼名字，我通知你家裡的人。」\n騎士忍著痛說：", a:"「不用了……我的家人……知道我的名字。」" },
  { id:"kl016", src:"痞客邦", cat:"短故事", q:"一女生徵婚條件輸入電腦：1.要帥 2.要有車 → 象棋。\n改輸入：1.要有錢 2.要有房子 → 銀行。\n再輸入：1.要man 2.要有安全感 → 鹹蛋超人。\n最後全部條件一起輸入……", a:"電腦回她：「在銀行下象棋的鹹蛋超人！」" },
  { id:"kl017", src:"痞客邦", cat:"短故事", q:"大象走進森林忘記帶面紙，抓了小白兔來擦屁股。\n隔天，大象吃完午餐要擦嘴，松鼠說話了：", a:"「大象你忘記我啦！我是昨天的小白兔！」" },
  { id:"kl018", src:"痞客邦", cat:"短故事", q:"大便跟小便兩個是好朋友，有天大便死了，小便就很難過地說：", a:"「我想大便～」" },
  { id:"kl019", src:"痞客邦", cat:"短故事", q:"一隻貓跟一隻小小鳥相遇。\n貓：「你感動嗎？」\n鳥：", a:"「我不敢動。」" },
  { id:"kl020", src:"痞客邦", cat:"腦筋急轉彎", q:"如果動物園失火了，最先逃出來的是哪一種動物？", a:"人。" },
  { id:"kl021", src:"痞客邦", cat:"短故事", q:"有一天小明說：「老師，小安他人身攻擊我。」\n老師：「那你可以用當歸反擊啊！」", a:"（當歸→擋龜？→以藥材回擊）" },
  { id:"kl022", src:"痞客邦", cat:"短故事", q:"我講一個笑裡藏刀的笑話：", a:"「哈哈哈哈哈哈哈哈刀哈哈哈哈哈哈哈哈」" },
  { id:"kl023", src:"痞客邦", cat:"腦筋急轉彎", q:"為什麼馬克杯跟玻璃杯打招呼，玻璃杯不理他？", a:"因為玻璃杯沒耳朵。" },
  { id:"kl024", src:"痞客邦", cat:"腦筋急轉彎", q:"哪一個字需要寫很久？", a:"「朋」，因為一寫就要寫兩個月。" },
  { id:"kl025", src:"痞客邦", cat:"腦筋急轉彎", q:"為什麼飯不能咬太久呢？", a:"因為會飯（犯）太碎（歲）～" },
  { id:"kl026", src:"痞客邦", cat:"短故事", q:"媽媽：「如果妳老公有外遇，你會怎麼樣？」\n女兒：「我會睜一隻眼，閉一隻眼。」\n媽媽：「妳這麼大方！」\n女兒：", a:"「不，我是要用槍瞄準他～」" },
  { id:"kl027", src:"痞客邦", cat:"短故事", q:"老王跟小明約好誰先上天堂就託夢告訴對方有沒有棒球。\n結果小明先走了，有一天，老王睡覺夢到小明來託夢：「老王，天堂真的有棒球欸！下禮拜你來擔任右外野手。」", a:"（老王下禮拜就死了）" },
  { id:"kl028", src:"痞客邦", cat:"短故事", q:"老王娶了跆拳五段的妻子。有一天，老婆問：「老公，你覺得我漂不漂亮？」\n老王：「漂亮！漂亮！」\n老婆：「你說我漂亮，是不是怕傷害我啊？」\n老王抖著說：", a:"「不，我是怕妳會傷害我！」" },
  { id:"kl029", src:"痞客邦", cat:"短故事", q:"老闆叫秘書買玫瑰花，一個情人送一朵就行。秘書打電話問：「boss，你有幾個情人？」\n老闆：「是一個人。」\n秘書：「11個人？」\n老闆：「不是11個，是一個人。」\n秘書：「21個人？」\n老闆吼：「就是一個人！」\n秘書：「91個？」\n老闆：「吼！二百五，是一個人啊。」\n秘書：", a:"「251個人？！……」\n（老闆頓時暈倒）" },
  { id:"kl030", src:"痞客邦", cat:"短故事", q:"病人：「醫生，最近我總覺得自己是一條狗。」\n醫生：「從什麼時候開始的？」\n病人：「從我還是小狗的時候。」\n醫生：", a:"「那你應該去看獸醫。」" },
  { id:"kl031", src:"痞客邦", cat:"短故事", q:"媽媽說：喜歡喝什麼可以看出一個人的社交習慣！喝奶茶的女人閨蜜多，喝白酒的女人故事多，喝紅酒的女人情人多。\n我說：「那像我這種愛喝白開水的女人呢？」", a:"「尿多。」" },
  { id:"kl032", src:"痞客邦", cat:"地獄梗", q:"阿公買了一隻從茶室帶回來的鸚鵡，掛在陽台。\n鸚鵡：「環境變了！環境變了！」\n媽媽跑來看，鸚鵡：「老闆娘換了！老闆娘換了！」\n女兒跑來看，鸚鵡：「小姐也換了！小姐也換了！」\n這時候爸爸回來了，鸚鵡說：", a:"「人客沒變！人客沒變！」" },
  { id:"kl033", src:"痞客邦", cat:"短故事", q:"有一日上國文課，老師說：「以後上網發言不要再自稱『筆者』，現在根本沒人用筆寫字。」\n學生：「那要怎麼稱呼?」\n老師：「鍵人。」\n學生：「那用滑鼠的人呢？」\n老師：「叫鼠輩。」\n學生：「那智慧型手機都用觸控式的，又沒鍵盤、沒滑鼠，又該怎麼稱呼？」\n老師：", a:"「那就叫……指望你們了。」" },

  { id:"mm001", src:"網路", cat:"短故事", q:"有一天小明去圖書館，小明說：「我要一碗牛肉麵。」\n櫃檯：「先生，這裡是圖書館。」\n小明很抱歉地說：", a:"「喔喔好（氣音）……我要一碗牛肉麵。」" },
  { id:"mm002", src:"網路", cat:"短故事", q:"有一天父親拿一根筷子讓兒子折，折斷了。又拿三隻，折斷了。再拿三十隻，還是折斷了。\n兒子問：「爸，你到底要幹嘛？」\n父親說：", a:"「沒事。」" },

  { id:"mm006", src:"網路", cat:"短故事", q:"有一天小明他爸很渴，叫小明幫他倒水，但小明遲遲沒去。\n小明爸說：「你是要逼爸渴死嗎？」\n於是小明就……", a:"開始B Box了。（渴死→可死→Beatbox）" },

  { id:"bb030", src:"痞客邦", cat:"短故事", q:"男友問：「妳以前談過幾次戀愛？」\n女友：「算你一個，還有三個在考慮中。」\n男友：「那加起來是四個！」\n女友：", a:"「對呀，四捨五入等於零。」" },
  { id:"bb031", src:"痞客邦", cat:"短故事", q:"男：「妳怎麼那麼可愛，讓我不知道怎麼形容妳。」\n女：「那就不要形容了。」\n男：「一定要說！妳就像⋯⋯一條魚！」\n女：「魚？！」\n男：", a:"「因為我想把你釣回家。」" },
  { id:"bb032", src:"痞客邦", cat:"短故事", q:"女友問：「我跟電視哪個重要？」\n男友果斷地說：「妳。」\n女友驚喜：「真的？為什麼？」\n男友：", a:"「因為現在是廣告時間。」" },
  { id:"bb033", src:"痞客邦", cat:"短故事", q:"女：「你說你愛我，但你有沒有為我做過什麼犧牲？」\n男想了想說：「有啊！」\n女：「什麼？」\n男：", a:"「和妳交往之後，我再也沒去找過別的女人。」" },
  { id:"bb034", src:"痞客邦", cat:"短故事", q:"太太問：「如果我先死了，你會不會再娶？」\n丈夫：「不會。」\n太太：「為什麼？」\n丈夫：", a:"「因為妳娘家的人會殺了我。」" },
  { id:"bb035", src:"痞客邦", cat:"短故事", q:"妻：「你說說，你愛我什麼？」\n夫：「哎，說來話長——」\n妻：「長？」\n夫：", a:"「說來話長短，妳說呢？」（說來話長短→說不出來？其實是指話很多）" },
  { id:"bb036", src:"痞客邦", cat:"短故事", q:"老婆哭著問：「你是不是嫌棄我老了，不愛我了？」\n老公柔聲說：「哪有，我只是在想——」\n老婆：「想什麼？」\n老公：", a:"「你之前說的那個保養品，我去幫你買。」" },
  { id:"bb037", src:"痞客邦", cat:"地獄梗", q:"有個老先生每天去圖書館借一本書，看完隔天還回來再借一本，持續了幾十年。\n有一天圖書館員好奇問他：「老先生，你這輩子讀了多少本書？」\n老先生想了想說：", a:"「算起來應該差不多把圖書館搬回家過一遍了。現在只剩一本我還沒看。」\n館員：「哪一本？」\n老先生：「借書登記本。」" },
  { id:"bb038", src:"痞客邦", cat:"短故事", q:"老師：「如果有人送你一百萬，你打算怎麼用？」\n小明：「我要買一台新電腦。」\n老師：「那剩下的錢呢？」\n小明：", a:"「等著吧。」" },
  { id:"bb039", src:"痞客邦", cat:"腦筋急轉彎", q:"什麼動物最沒記性？", a:"魚，3秒就忘記了。但也因此，牠每天都活得很快樂。" },
  { id:"bb040", src:"痞客邦", cat:"短故事", q:"媽媽說：「今天作業做完了嗎？」\n孩子：「做完了。」\n媽媽：「那你有沒有複習？」\n孩子：「有。」\n媽媽：「那你有沒有預習明天的功課？」\n孩子沉默一下：", a:"「我的手機沒電了。」" },
  { id:"bb041", src:"痞客邦", cat:"短故事", q:"女兒問：「媽，結婚是什麼感覺？」\n媽媽正在做菜，把一顆雞蛋打入鍋中，說：", a:"「就像這顆蛋，下去就回不來了。」" },
  { id:"bb042", src:"痞客邦", cat:"地獄梗", q:"法官問被告：「你承認你搶了那位老太太的手提包嗎？」\n被告：「法官大人，我哪裡是搶，我是借。」\n法官：「借？有打算還嗎？」\n被告：", a:"「本來有，但她跑太慢被我追上了。」" },
  { id:"bb043", src:"痞客邦", cat:"短故事", q:"一個人去看牙醫，結果越想越怕，到診所門口就跑掉了。\n診所護士追出來說：「先生！先生！不用怕的，很快就好了！」\n那人繼續跑，大喊：", a:"「你是說換我就好了！我知道！」" },

  { id:"bb045", src:"痞客邦", cat:"短故事", q:"老師問：「請問誰知道『鴻漸於陸』是什麼意思？」\n全班沉默。\n老師嘆了口氣：「就是大雁慢慢飛到陸地上的意思。」\n小明舉手：「老師，那『鴻漸於逵』呢？」\n老師：「就是大雁飛到十字路口。」\n小明又問：「那有沒有鴻漸於沙？」\n老師：「沒聽過，為什麼？」\n小明：", a:"「我想看大雁沙灘排球。」" },

  { id:"bq063", src:"痞客邦", cat:"腦筋急轉彎", q:"一個人把5個橘子平分給5個小孩，每人一個，但籃子裡還有一個橘子，為什麼？", a:"最後一個小孩連籃子一起拿走了" },
  { id:"bq064", src:"痞客邦", cat:"腦筋急轉彎", q:"一個人在房間裡睡覺，房間沒有窗戶、沒有門，他怎麼出去？", a:"停止睡覺就出去了（夢裡）" },
  { id:"bq065", src:"痞客邦", cat:"腦筋急轉彎", q:"世界上什麼東西最乾淨，什麼最髒？", a:"最乾淨是牙齒，最髒也是牙齒（吃最多的東西）" },

  // ── 寶貝問路 鬼月笑話特輯 第8集 ─────────────────────────
  { id:"gh001", src:"痞客邦", cat:"短故事", q:"鬼最怕三種東西：咖啡、錢、女人。\n為什麼？", a:"鬼怕咖啡因為咖啡可提神；鬼怕錢因為有錢可使鬼推磨；最怕女人，因為她能移神移鬼。" },
  { id:"gh002", src:"痞客邦", cat:"短故事", q:"晚上11點散步路過墳地，被老婆婆問那麼晚在街上幹嘛。我說：「我在等我的家人給我錢！」\n老婆婆臉色蒼白，轉身狂奔。\n我大喊：「老婆婆不要跑，我真的在等家人給我錢！」\n結果……", a:"四周的人也全跑走了。" },
  { id:"gh003", src:"痞客邦", cat:"短故事", q:"有女子夜晚被好色男子尾隨，走到墳地旁，她當機立斷走到一座墳墓前說：「爸爸，開門吧！我回來了。」嚇跑了跟蹤男。\n女子得意地笑了起來，哪知笑聲未落，從墳墓裡傳出：「女兒，你怎麼又忘記帶鑰匙了？」\n嚇得女子狂奔。此時盜墓者從墳墓裡爬出來說：「影響我工作，嚇死你。」\n盜墓者突然看到老翁在刻墓碑，問：「你在幹嘛？」\n老翁：「這些不肖子孫把我的墓碑刻錯了，只好自己來改。」嚇跑了盜墓者。\n老翁的鑿子掉地上，從草叢中伸出一隻手：「誰啊？敢亂改我家的門牌號碼！」嚇跑了老翁。\n從草叢中爬出一個拾荒者，撿起鑿子，感嘆：", a:"「這年頭，撿塊爛鐵，還得這麼費神……」" },

  // ── 寶貝問路 靠北經典搞笑語錄精選 ─────────────────────
  { id:"kb001", src:"痞客邦", cat:"短句梗", q:"一分鐘有多長，這是要看你……", a:"蹲在廁所裡面還是蹲在廁所外面。" },
  { id:"kb002", src:"痞客邦", cat:"短句梗", q:"一隻大象問駱駝：「你的咪咪怎麼長在背上？」\n駱駝說：", a:"「死遠點，我不和雞雞長在臉上的東西講話！」" },
  { id:"kb003", src:"痞客邦", cat:"短句梗", q:"我喜歡你，就像你媽打你……", a:"不講道理。" },
  { id:"kb004", src:"痞客邦", cat:"短句梗", q:"物價漲得太快，所以我在餐館吃飯的時候……", a:"都會先付錢。" },
  { id:"kb005", src:"痞客邦", cat:"短句梗", q:"一早醒來我以為我長大了，原來是……", a:"被子蓋橫了。" },
  { id:"kb006", src:"痞客邦", cat:"短句梗", q:"別人的錢財乃……", a:"我的身外之物！" },
  { id:"kb007", src:"痞客邦", cat:"短句梗", q:"與人爭執時，退一步海闊天空；追女友時，退一步……", a:"人去樓空。" },
  { id:"kb008", src:"痞客邦", cat:"短句梗", q:"生，容易。活，容易。生活……", a:"不容易。" },
  { id:"kb009", src:"痞客邦", cat:"短句梗", q:"人人都說我醜，其實……", a:"我只是美得不明顯。" },
  { id:"kb010", src:"痞客邦", cat:"短句梗", q:"脫了衣服我是禽獸，穿上衣服我是……", a:"衣冠禽獸！" },
  { id:"kb011", src:"痞客邦", cat:"短句梗", q:"愛情是藝術，結婚是技術，離婚是……", a:"算術。" },
  { id:"kb012", src:"痞客邦", cat:"短句梗", q:"逝去的愛情就跟落枕一樣……", a:"回頭會很痛！" },
  { id:"kb013", src:"痞客邦", cat:"短句梗", q:"還是古代好混，割掉了就能……", a:"當公務員。" },
  { id:"kb014", src:"痞客邦", cat:"短句梗", q:"發怒一分鐘便失去……", a:"60秒的幸福。" },
  { id:"kb015", src:"痞客邦", cat:"短句梗", q:"人的一生就像在拉屎，有時你已經很努力了……", a:"可出來的只是一個屁。" },
  { id:"kb016", src:"痞客邦", cat:"短句梗", q:"老公是最好的傾聽者，因為……", a:"他根本沒在聽！" },
  { id:"kb017", src:"痞客邦", cat:"短句梗", q:"令人不能自拔的，除了牙齒還有……", a:"愛情。" },
  { id:"kb018", src:"痞客邦", cat:"短句梗", q:"其實我並不笨，只是……", a:"懶得聰明罷了。" },
  { id:"kb019", src:"痞客邦", cat:"短句梗", q:"帥有個屁用！到頭來還不是……", a:"被卒吃掉！" },
  { id:"kb020", src:"痞客邦", cat:"短句梗", q:"我要讓全世界知道……", a:"我很低調！" },
  { id:"kb021", src:"痞客邦", cat:"短句梗", q:"不要以為全世界只有你一個在傷心，其實別人……", a:"只是比你會掩飾。" },
  { id:"kb022", src:"痞客邦", cat:"短句梗", q:"眾裡尋他千百度，驀然回首……", a:"那人依舊對我不屑一顧。" },
  { id:"kb023", src:"痞客邦", cat:"短句梗", q:"命運又給我洗了一次牌，但玩牌的……", a:"還是我自己。" },

  // ── 寶貝問路 爆笑第1集精選（新的）────────────────────────
  { id:"e1_01", src:"痞客邦", cat:"短故事", q:"阿嬤和小孫子搭電梯，一個高大帥氣的男人進來，身上充滿濃烈的古龍水味道。\n阿嬤湊近聞了聞，大聲說：「你抹了很多的膏耶！」\n男人有點尷尬。\n阿嬤補了一刀：", a:"「你有痱子嗎？」（阿嬤以為是痱子膏）" },
  { id:"e1_02", src:"痞客邦", cat:"短故事", q:"有個人脖子上長了一個包，去看醫生。\n醫生說：「沒事，是良性腫瘤，不用在意它。」\n隔年回診，腫瘤消失了。\n醫生問：「怎麼消失的？」\n病人：「我在意它了。」", a:"（認真在意 → 腫瘤消失）" },
  { id:"e1_03", src:"痞客邦", cat:"短故事", q:"有位婦人坐公車，突然一個老人上車，婦人連忙起立讓座。\n老人感激地說：「謝謝妳，真是好人。」\n婦人微笑說：「應該的，我也是做媽媽的人。」\n老人頓了頓，問：", a:"「妳幾歲了？我才58而已。」" },
  { id:"e1_04", src:"痞客邦", cat:"短故事", q:"一個人站在橋上要跳河，警察趕到勸說了一個小時還是說不動。\n警察長官問：「情況怎樣？」\n警察回：「說不動他，反而……」", a:"「反而快被他說動了，我們兩個都想跳了。」" },
  { id:"e1_05", src:"痞客邦", cat:"短故事", q:"老師問：「你們知道糞便英文怎麼說嗎？」\n全班安靜。\n老師說：「是poo。」\n小明舉手問：「那大便呢？」", a:"老師：「都是poo！」\n小明：「那小便呢？」\n老師：「small poo？」（全班爆笑）" },
  { id:"e1_06", src:"痞客邦", cat:"短故事", q:"爸爸說：「兒子，我跟你說，男人不能輕易說對不起，也不能輕易說沒關係，知道嗎？」\n兒子：「為什麼？」\n爸爸說：「因為說了對不起，就要改；說了沒關係，就要忍。」\n兒子想了想問：", a:"「那我說謝謝呢？」\n爸爸：「那對方要說不客氣。」\n兒子：「這樣不是很虧嗎？」" },
  { id:"e1_07", src:"痞客邦", cat:"短故事", q:"夫妻倆吵架，太太越說越激動，拿起擀麵棍就要打老公。\n老公問：「你要幹嘛？」\n太太：「我要打死你！」\n老公冷靜說：「好，你打吧。不過你要想清楚，我死了之後……」\n太太愣了一下，放下擀麵棍問：「死了之後怎麼樣？」\n老公接著說：", a:"「死了之後，家裡的蟑螂就沒人打了。」" },
  { id:"e1_08", src:"痞客邦", cat:"短故事", q:"兩個小孩比賽吃辣，看誰先哭。\n第一個小孩吃了五秒就哭了。\n第二個小孩吃了十分鐘，一滴眼淚都沒流，贏了。\n裁判問他：「你到底怎麼辦到的？」\n他回答：", a:"「我忍不住想到我阿公昨天死了。」" },
  { id:"e1_09", src:"痞客邦", cat:"短故事", q:"老師叫小明造句：「請用「礙」字造句。」\n小明：「我的作業礙做完了。」\n老師：「礙是阻礙的礙，不是已經的已。再造一次。」\n小明：「我礙你這個老師。」\n老師：「什麼意思？」\n小明：", a:"「阻礙。我阻礙你這個老師。」（再想想……）" },
  { id:"e1_10", src:"痞客邦", cat:"短故事", q:"媽媽生氣叫兒子跪算盤，罰他跪一小時。\n半小時後媽媽心軟說：「好了，起來吧。」\n兒子說：「再等等，我有點事。」\n媽媽不解，湊近一看：", a:"兒子正在用膝蓋盤算盤上把算珠撥來撥去。" },
  { id:"e1_11", src:"痞客邦", cat:"短故事", q:"有一個人去算命，算命師說：「你將來會窮困潦倒，直到45歲。」\n那人問：「然後呢？45歲之後呢？」\n算命師說：", a:"「然後你就習慣了。」" },
  { id:"e1_12", src:"痞客邦", cat:"短故事", q:"小美嫁給了一個禿頭的人，朋友問：「他哪裡好？」\n小美說：「他是個完美的男人。」\n朋友問：「你不嫌他禿頭嗎？」\n小美說：「不嫌，禿頭的男人……」", a:"「要麼聰明，要麼性感，他兩樣都不是，所以完美。」" },
  { id:"e1_13", src:"痞客邦", cat:"短故事", q:"弟弟對哥哥說：「哥，我借你一萬元吧？」\n哥哥感激地說：「太好了，我正需要！」\n弟弟：「好，那我向你借一萬元。」\n哥哥：「……你說什麼？」\n弟弟：", a:"「剛才說借你一萬，現在要借回來。」（邏輯上說得通）" },
  { id:"e1_14", src:"痞客邦", cat:"短故事", q:"病人問醫生：「我這種病治好了之後，能不能去爬山？」\n醫生說：「當然可以。」\n病人開心說：「太好了！那我以前不能爬山的，治好之後就能去爬山了！」\n醫生沉默了一下說：", a:"「你以前不能爬山，是因為你懶，跟這個病沒關係。」" },
  { id:"e1_15", src:"痞客邦", cat:"短故事", q:"小明去廟裡拜神，虔誠地說：「神明啊！請保佑我考試100分！」\n廟祝說：「神明很忙，你要許清楚一點，是哪一科100分？」\n小明想了想說：", a:"「每一科100分。」\n廟祝：「你這不就是許願全部都100嗎？」\n小明：「我就是要許這個啊。」\n廟祝嘆氣：「你家裡有供奉神農大帝嗎？」\n小明：「沒有，為什麼？」\n廟祝：「因為你在異想天開。」" },

  // ── 寶貝問路 爆笑第2集精選 ──────────────────────────────
  { id:"e2_01", src:"痞客邦", cat:"短故事", q:"舅舅來家裡做客，小文卻對媽媽說：「媽媽，我要去動物園看猴子。」\n媽媽立即怒罵道：「看什麼猴子？你舅舅在這，你還去什麼動物園？」", a:"（媽媽自己說出來的）" },
  { id:"e2_02", src:"痞客邦", cat:"短句梗", q:"醫學報導連續抽菸600個月……", a:"可以多活50歲。" },
  { id:"e2_03", src:"痞客邦", cat:"短故事", q:"蘋果跟梨子在比賽，看誰先講到自己名字就輸了。\n梨子很興奮的說：「來啊！」", a:"於是梨子就輸了。" },
  { id:"e2_04", src:"痞客邦", cat:"短故事", q:"爸爸快過世了，把三個兒子叫來床邊，要讓他們明白團結的道理。叫老大折一根筷子、老二折十根、老三折一整把，三個兒子都做到了。\n三人不解地問：「所以爸爸找我們來有什麼事？」\n爸爸說：", a:"「沒事了……」" },
  { id:"e2_05", src:"痞客邦", cat:"短故事", q:"女朋友吵著問我：「我跟你媽困在火場你會先救誰？」\n我：", a:"「先救火。」" },
  { id:"e2_06", src:"痞客邦", cat:"短故事", q:"星期天哪裡越南人最多？", a:"越南。" },
  { id:"e2_07", src:"痞客邦", cat:"短故事", q:"醫生：「Tony，不要緊張這只是個小手術。」\n病人：「我不叫Tony。」\n醫生：", a:"「我知道，Tony是我。」" },
  { id:"e2_08", src:"痞客邦", cat:"短故事", q:"有個人對著山洞大喊：「嗚郎滴欸某？」\n山洞裡有聲音回答：「嗚~~」\n然後……", a:"他就被火車撞死了。" },
  { id:"e2_09", src:"痞客邦", cat:"短故事", q:"愚公臨死前召集兒子來到床邊虛弱地說：「移山…移山………」\n兒子：「亮晶晶？」", a:"愚公卒。" },
  { id:"e2_10", src:"痞客邦", cat:"短故事", q:"有一對情侶吵架，女生很生氣地奪門而出，然後男生很快速地跑出去……", a:"把門奪回來了。" },
  { id:"e2_11", src:"痞客邦", cat:"短故事", q:"平地的貓咪都會喵喵叫，那山上的貓呢？", a:"喵的拉。" },
  { id:"e2_12", src:"痞客邦", cat:"短故事", q:"小明去夜市吃臭豆腐。\n小明：「老闆，這臭豆腐怎麼那麼軟？」\n老闆：", a:"「因為你沒認真吃啊！認真就酥（輸）了！」" },
  { id:"e2_13", src:"痞客邦", cat:"短故事", q:"有天小明到天庭跟眾仙開會。\n小明：「玉皇大帝，千手觀音為什麼還沒到呢？」\n玉皇大帝：", a:"「因為她還在洗手……」" },
  { id:"e2_14", src:"痞客邦", cat:"短故事", q:"約翰問中國朋友：「你們中國人真有人情味，何以見得？」\n約翰：「我們西方人路上車禍，一定先打電話叫救護車，而你們中國人……」", a:"「卻先問候別人的媽媽。」" },
  { id:"e2_15", src:"痞客邦", cat:"短故事", q:"動物園的一頭大象死了，一個職員在旁邊痛哭。\n遊客說：「這個人對死去的大象真有感情。」\n主管聽到說：", a:"「當然不是這樣，是因為我要他負責為大象挖個墓坑。」" },
  { id:"e2_16", src:"痞客邦", cat:"地獄梗", q:"法官怒斥被告：「我擔任這個地方法院法官這些年，已經在法庭上見過你七次，難道你不覺得羞恥嗎？」\n被告：", a:"「你不能升官，可不是我的過錯。」" },
  { id:"e2_17", src:"痞客邦", cat:"短故事", q:"男朋友問女朋友：「除了我，還有什麼人吻過你？」\n女朋友沉默片刻。\n男朋友：「快點回答我吧！」\n女朋友：", a:"「不要吵，我正在數！」" },
  { id:"e2_18", src:"痞客邦", cat:"短故事", q:"老師：「小新，現在用一句成語來形容老師很開心？」\n小新答：", a:"「含笑九泉。」" },
  { id:"e2_19", src:"痞客邦", cat:"短故事", q:"奧運100米決賽產生世界紀錄。\n小明：「我爸爸跑的話，只要九秒。」\n小華：「我爸爸更厲害，起跑的一瞬間，他就出現在終點了。」\n小強：", a:"「我爸爸才厲害，他公司五點下班，他四點半就坐在家裡看電視了。」" },
  { id:"e2_20", src:"痞客邦", cat:"短故事", q:"小明的媽媽要他出去買雞蛋。\n小明說：「等一下！」\n媽媽說：「等什麼等？我自己出去買算了！」\n小明說：", a:"「我就是等妳這句話！」" },
  { id:"e2_21", src:"痞客邦", cat:"短故事", q:"小明：「爸爸，這次中期考試我有一半科目不及格…」\n爸爸：「沒關係，繼續努力！」\n幾個月後，小明：「爸爸，這次我有一半的科目及格啦！」\n爸爸：", a:"「不錯，有進步，繼續努力……」（兩次都是一半）" },
  { id:"e2_22", src:"痞客邦", cat:"短故事", q:"小明說：「爸爸，講歷史故事給我聽呀！」\n爸爸：「從前，有一隻青蛙……」\n小明：「我要聽歷史故事！」\n爸爸：", a:"「好……在宋朝，有一隻青蛙……」" },
  { id:"e2_23", src:"痞客邦", cat:"短故事", q:"小明下班回家，老婆說：「老公我有好消息和壞消息，先說哪個？」\n小明：「好消息。」\n老婆：「原來我們汽車的安全氣囊是有效的。」", a:"（壞消息是出車禍了）" },
  { id:"e2_24", src:"痞客邦", cat:"地獄梗", q:"皇帝對小李子說：「你用一個字來形容朕。」\n小李子回答：「喳！」", a:"然後小李子就被砍了。（喳→查→暗指皇帝有問題）" },
  { id:"e2_25", src:"痞客邦", cat:"短故事", q:"A：你有《時間簡史》嗎？\nB：", a:"神經病，我有時間也不撿屎！" },

  // ── 寶貝問路 爆笑第4集 醫生系列精選 ────────────────────
  { id:"e4_01", src:"痞客邦", cat:"地獄梗", q:"醫生：「我有壞消息跟更慘的消息要跟你說。壞消息是你最多只剩24小時了。」\n老人：「那更慘的消息是什麼？」\n醫生：", a:"「本來昨天就要說的。」" },
  { id:"e4_02", src:"痞客邦", cat:"短故事", q:"醫生：「你知道時間就是金錢這句話吧？」\n老人：「嗯。」\n醫生：", a:"「你破產了。」" },
  { id:"e4_03", src:"痞客邦", cat:"短故事", q:"醫生：「阿嬤今天怎麼了？」\n阿嬤：「醫生，我只要這樣，這裡就會很痛耶！」\n醫生：", a:"「那你就不要這樣。」" },
  { id:"e4_04", src:"痞客邦", cat:"地獄梗🔞", q:"醫生：「你的洞很大……洞很大。」\n病患：「你不需要說兩次！」\n醫生：", a:"「我沒有，那是回音。」" },
  { id:"e4_05", src:"痞客邦", cat:"地獄梗", q:"醫生：「病人已經沒有心跳了！」\n護士：", a:"「沒關係，快Po上臉書叫大家集氣。」" },
  { id:"e4_06", src:"痞客邦", cat:"短故事", q:"醫生：「放輕鬆志明，這只是一個很小的傷口而已，不用緊張。」\n病人：「醫生，我不叫志明……」\n醫生：", a:"「我知道，志明是我。」" },
  { id:"e4_07", src:"痞客邦", cat:"短故事", q:"醫生：「我有壞消息和更慘的消息要跟你說。」先說壞消息。\n壞消息：你最多只剩24小時了。\n更慘的消息：", a:"本來昨天就要說的。" },
  { id:"e4_08", src:"痞客邦", cat:"短故事", q:"老人：「醫生，我每天早上起床的時候，背都很痛！」\n醫生：「那你換成下午起床就好了。」", a:"（直接解決問題）" },
  { id:"e4_09", src:"痞客邦", cat:"短故事", q:"一個人問老中醫：「醫師，我的病是不是無藥可救了？」\n老中醫說：「不會的，中醫自古到今醫好了多少病人，那些醫不好的……」", a:"「都死了，沒法說話。」" },
  { id:"e4_10", src:"痞客邦", cat:"短故事", q:"病人手術後問醫生：「我還能活多久？」\n醫生說：「10。」\n病人：「10年？10個月？還是10天？」\n醫生：", a:"「9……8……7……」" },
  { id:"e4_11", src:"痞客邦", cat:"短故事", q:"有位老太太去看骨科醫生，醫生說：「妳這是老化現象，是自然規律，沒有藥可醫的。」\n老太太說：「醫生，我另一隻膝蓋也是同樣年紀，怎麼它沒這樣？」\n醫生：", a:"（沉默）" },
  { id:"e4_12", src:"痞客邦", cat:"短故事", q:"小兒科醫生替小孩子看診，不忘安慰說：「來，張開嘴巴說啊。」\n孩子的媽媽說：「不用，醫生，他的問題在腳。」\n醫生說：", a:"「我知道，但我想讓你媽媽閉嘴。」" },
  { id:"e4_13", src:"痞客邦", cat:"短故事", q:"護士在急診室門口用廣播呼叫：「請問有沒有人認識這個人？」\n一個老人走過來說：「我認識他。」\n護士：「他叫什麼名字？」\n老人：", a:"「我不知道他叫什麼，但我在他的口袋裡看到我的錢包。」" },
  { id:"e4_14", src:"痞客邦", cat:"地獄梗", q:"醫生對病人說：「你生病的原因是因為你喝太多酒、太胖、而且完全不運動。」\n病人：「醫生，我需要第二個意見。」\n醫生：", a:"「好，你很醜。」" },
  { id:"e4_15", src:"痞客邦", cat:"短故事", q:"有位先生去看醫生，說胃不舒服。\n醫生說：「你最近吃了什麼？」\n先生說：「醫生，我是個正常人，今天早上吃了油條豆漿，中午吃了便當，晚上……」\n醫生打斷說：「好，你先脫掉衣服。」\n先生：「那我晚上吃的……」\n醫生：", a:"「我不需要知道你晚上吃什麼，我只需要你脫衣服。」" },

  { id:"e5_04", src:"痞客邦", cat:"短故事", q:"全國最富的人請了全國最好的建築師來給自己建造陵墓。三年之後，富翁問建築師：「全部工程都完成了嗎？」\n「差不多了。」\n「還差什麼呢？」\n建築師說：", a:"「只差你了。」" },
  { id:"e5_05", src:"痞客邦", cat:"短故事", q:"老師：「這作業是你自己作的嗎？」\n學生：「不，爸爸幫我作的。」\n老師：", a:"「回去跟你爸爸說，星期天他也要來補課。」" },

  { id:"e5_07", src:"痞客邦", cat:"腦筋急轉彎", q:"為什麼櫻花鉤吻鮭敢跟熊打架？", a:"因為它特有種。" },

  { id:"e5_12", src:"痞客邦", cat:"短故事", q:"有一天有個外國人來台灣觀光，上公車後準備投錢。\n司機：「下車投。」\n外國人卻執意要投，司機不耐煩再說：「下車投！」\n於是外國人下車後，不滿地看著司機大喊：", a:"「窩油不是Michael Jordan！」" },
  { id:"e5_13", src:"痞客邦", cat:"短故事", q:"有一間門庭若市的店，一名男子對服務人員說：「我是貴賓欸，憑什麼要排隊！」\n店員：", a:"「就算是哈士奇也要排隊。」" },
  { id:"e5_14", src:"痞客邦", cat:"短故事", q:"兒子：「賤賤賤賤賤賤賤……」\n媽媽：「醫生啊，這小子從昨晚一直喊到現在，這到底是什麼怪病？」\n醫生沉思後說：", a:"「嗯……這是一種罕見的疾病。」" },
  { id:"e5_15", src:"痞客邦", cat:"短故事", q:"我：「欸，你跟我借白膠。」\n友人：「喔！借我白膠。」\n我：「我沒有。」\n友人：「……」\n我：", a:"「我只是想讓你知道我這個朋友沒有白膠。」" },
  { id:"e5_16", src:"痞客邦", cat:"短故事", q:"當榴槤遇到釋迦，榴槤說：「區區一個釋迦憑什麼跟我講話！」\n釋迦說：「我不是一般的釋迦！我是……」", a:"「貴族釋迦！」" },

  { id:"e5_18", src:"痞客邦", cat:"腦筋急轉彎", q:"民間盛傳，李白水裡撈月，因而溺死……", a:"白白送死。" },

  { id:"e5_21", src:"痞客邦", cat:"短故事", q:"「爸爸，我今天可不可以留在家裡？我覺得不舒服。」\n「你覺得什麼地方不舒服？」\n小兒子：", a:"「學校。」" },
  { id:"e5_22", src:"痞客邦", cat:"短故事", q:"一位年輕人很想獲得自由，跑去問自由女神如何才能得到自由。\n自由女神說：", a:"「你看我自由嗎？」" },
  { id:"e5_23", src:"痞客邦", cat:"短故事", q:"雞跟牛發牢騷：「人讓我們多下蛋，自己卻計劃生育，太不公平了！」\n牛說：", a:"「你那點委屈算什麼，那麼多人喝我的奶，有誰叫我一聲媽！」" },
  { id:"e5_24", src:"痞客邦", cat:"短故事", q:"老師問：「請用在乎兩字造句。」\n學生：「在乎胸口的傷痛，誰說時間能沖淡一切？」\n老師：「很好，非常感性！下一個。」\n另一學生：", a:"「在乎，就是在桌上放一個乎。」" },
  { id:"e5_25", src:"痞客邦", cat:"短故事", q:"有一個女孩從小被虐待，後來長大後報警抓了養父母，但記者採訪她時，她卻流著眼淚說：", a:"「謝謝你們，沒有他們的虐待，我今天不會這麼堅強。」" },
  { id:"e5_26", src:"痞客邦", cat:"短故事", q:"甲：「你說，為什麼人要孝順父母呢？」\n乙：「因為他們很辛苦把我們養大。」\n甲：「那如果他們對我們不好呢？」\n乙：", a:"「那就等他們老了再說。」" },
  { id:"e5_27", src:"痞客邦", cat:"短故事", q:"老師說：「失敗為成功之母。」\n學生問：「那成功為什麼之父？」\n老師：「努力。」\n學生：「那努力的媽媽是誰？」\n老師：「……」\n學生：", a:"「是不是失敗啊？所以失敗外孫成功。」" },
  { id:"e5_28", src:"痞客邦", cat:"短故事", q:"「老師，我能問您一個問題嗎？」\n「當然。」\n「如果我解決不了問題，又遇到問題，但解決了遇到問題的問題，這樣算有解決問題嗎？」\n老師沉默許久後說：", a:"「下課了。」" },
  { id:"e5_29", src:"痞客邦", cat:"短故事", q:"小明問：「老師，什麼是謊言？」\n老師說：「就是與事實不符的話。」\n小明：「那老師上課說的話都是謊言？」\n老師：「為什麼？」\n小明：", a:"「因為老師說上課要集中精神聽講，但老師上課時眼睛都閉著。」" },
  { id:"e5_30", src:"痞客邦", cat:"短故事", q:"外國記者問中國學生：「你有沒有自由發言的權利？」\n學生：「當然有，我可以批評美國總統。」\n記者：「那你可以批評中國主席嗎？」\n學生：", a:"「我剛說了，我可以批評任何一位我想批評的外國領袖。」" },
  { id:"e5_31", src:"痞客邦", cat:"短故事", q:"老師：「為什麼遲到？」\n學生：「因為路上有個告示牌。」\n老師：「告示牌跟遲到有什麼關係？」\n學生：", a:"「告示牌上寫：前面施工，請繞道。」" },
  { id:"e5_32", src:"痞客邦", cat:"地獄梗", q:"有個人在面試時被問到：「你覺得自己最大的缺點是什麼？」\n他想了很久說：「我覺得我太誠實了。」\n面試官說：「這不算缺點吧？」\n他說：", a:"「我管你怎麼想。」" },
  { id:"e5_33", src:"痞客邦", cat:"短故事", q:"一個小孩問爸爸：「爸，你和媽媽是在哪裡認識的？」\n爸爸說：「在盲人機構。」\n小孩問：「你們都是盲人嗎？」\n爸爸說：", a:"「不，我們是去當義工的，但遇到之後雙眼都瞎了。」" },
  { id:"e5_34", src:"痞客邦", cat:"短故事", q:"媽媽：「你昨天是不是把弟弟弄哭了？」\n孩子：「沒有，弟弟自己哭的。」\n媽媽：「你做了什麼讓他哭？」\n孩子：「我只是跟他說，媽媽生他之前更喜歡我。」\n媽媽：「……」\n孩子：", a:"「他不相信，我是說真的。」" },
  { id:"e5_35", src:"痞客邦", cat:"短故事", q:"有個人被判了死刑，行刑前被問有什麼最後的願望。\n他說：「我想再吃一碗牛肉麵。」\n法官說：「好，今天就先暫停執行，等他把麵吃完。」\n三個小時後，他把麵推開說：", a:"「太鹹了，我不吃了。」\n（然後就這樣一直活著）" },

  { id:"m056", src:"網路精選", cat:"短故事", q:"有個男人怕老婆，有天對朋友說：「我今晚一定要讓老婆知道誰才是一家之主！」\n朋友隔天問結果如何。\n男人說：", a:"「她說她同意，從今以後我就是家裡最大的……只要她不嫌棄。」" },

  { id:"sx001", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"快把衣服脫掉", a:"有一個女孩,⻑得如花似玉。因為家庭因素,不得不跟她單身的小叔 住在一起。平常他們表面上都會裝得很正常。有一天,那女孩終於忍 不住了,把小叔叫到她房間去說: “小叔 ...... 我再也受不了了 ...... 我現 在命令你把我的外套脫掉。” 小叔默默的照做了。她深吸了一口氣,說: “現在 ...... 再脫掉我的上 衣。” 小叔仍然照做。那女孩還紅著臉又說 “我的胸罩也脫下 ......” 小叔猶豫了一會,但還是做了。 “接著 ...... 是我的內褲。” 女孩說。小叔也慢慢的脫了下來。 那女孩歎了口氣,接著對小叔說: “...... 好了 ...... 小叔!從現在開始, 我不准你再穿我的衣服了,聽到沒?”" },

  { id:"sx004", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"裸體美女", a:"面對裸體美女,不同的男人表現不一。通過⻑期的調查與觀察,有很 多的有趣發現,姑且歸納如下: 1 、兩眼發直型: 此類男人往往沒見過幾個女人或身邊儘是恐龍,見到美女如同見到外 星人一般,當場犯傻。若跟隨而去必如廣告裏那樣頭撞電線杆,腳踩 西瓜皮方始醒轉。美女見此若嫣然一笑,此君定會幸福的暈死。傻的 可愛但不做作,真實。 2 、故作鎮定型: 美女出現時故意左顧右盼,或隨意看兩眼,對同伴的議論不屑一顧。 眼睛卻總是用餘光窺視,生怕少看幾眼會終生遺憾。美女走遠後就對 同伴說我以前的女朋友比她好看多了。掩耳盜鈴加阿 Q 精神,虛偽的 虛偽次方。 3 、主動出擊型: 看到美女立即上前搭訕,看著自己的手錶問小姐幾點,然後說和我的 一樣。若小姐罵他神經病加速離去表明 MissionFailed 。若小姐也和他 打趣則有了一個好的開始,也就是成功了一半。有性格,豁得出去, 不怕失敗,不怕犧牲,爭取勝利。 4 、花花公子型: 往往是穿得花花綠綠喜歡裝酷的小混子。幾個人一擁而上,為首的 說: “小姐貴姓啊,晚上有空嗎,陪哥幾個玩玩,別走啊,交個朋友 吧,我這人特好,毛主席語錄最後一頁說我是個好同志 ...... 接著又找 下一個目標。應人人喊打,不過挺痞。 5 、身不由己型: 身邊有老婆或女友,只可偷偷看上兩眼過過癮,生怕回去跪洗衣板。 連欣賞美女的權利亦不復存在,可憐啊。 6 、視而不見型: 看見美女就像看見所有人一樣,一點沒反應。或要求太高或已看慣美 女或書呆子或 GAY ,總之有點另類。" },

  { id:"sx009", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"女僕搞出來 “ 鐵飯碗 ” 來歷的性笑話", a:"官府女僕摔碎一碗。女僕下跪認錯時,乳房微露,官性起即成好事, 不於追究。次日女僕叫醒午睡的官,告其又碎一碗,官又成全了她。 此後女僕常打碎碗,要求官懲罰,有時一日竟打碎三次碗。官年事已 高難以招架,遂將家裏的碗碟全部換成鐵的,女僕從此不用工作,工 餉照發,相傳這是 “鐵飯碗” 的來歷! 某男偶然從朋友處得知有這種文化,興沖沖去女僕咖啡廳體驗,結果 敗興而歸。 對朋友說服務態度極其不佳,朋友不解,去咖啡廳詢問方得知,那天 的主題是傲嬌。 ###################### “我是一個風騷女人,是嗎?” 一個放肆的女僕在女主人不理會她的時 候,這樣問, “我知道有的人比我更風騷,可是條件卻遠不及我。” 她 向女主人投去狡黠的眼光,接著說: “我比你漂亮得多,你知道這是誰 告訴我的?是你丈夫告訴我的。” “你說夠了!” 女主人嚴厲地說。 “我還沒有說完呢!” 女僕回答, “我接吻的功夫也比你高強,你想知道 這是誰告訴我的嗎?” “要是你再說是我的丈夫 ......” “不,這次可不是你的丈夫了。這是你的汽車司機告訴我的。” 某女僕在應徵的時後表示:離開前職的原因是因為主人夫妻倆不停的 吵架,不是先生和我吵,就是太太害我吵。" },

  { id:"sx061", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"老妓女自殺", a:"一個老婦女,想當年她是多麼的妖嬌美麗,該凸就凸,該凹就凹。又 剛好是做那種特殊行業的,生意好自然是不在話下。 可後來年華漸漸老去了,身材也都變樣了。她就突然覺得,每天生活 在這麼無聊的日子裏,倒不如死一死了事算了。 於是她就萌生了想自殺的念頭,可由於她以前沒讀過書,不知道心臟 在哪?就去問醫生。醫生好心的告訴她說,在左邊 RF 下面一公分就是 了。於是老婦女就回家試囉! 待一切準備就緒後,砰的一聲,不久後就聽到一陣大叫:哇!我的大 腿好痛啊!!" },
  { id:"sx062", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"夫妻同房", a:"夫妻同房,妻握著夫的 YJ 問: “這是什麼東西?” 夫答: “這是笑話。” 夫也摸妻的私處問: “這是何物?” 妻也答: “這也是笑話。” 夫說: “兩件東西不一樣,怎會是同名。” 妻說: “你的是公笑話,我的是母笑活。” 夫說: “公笑話想和母笑話玩玩。” 妻答: “那就來吧。” 雲雨正濃,妻問夫: “你那笑話還有沒有?” 夫答: “都進去了,不信你摸。” 妻一摸之下果真公笑話全進去了,妻問: “笑話是沒有了,這兩個在外 頭的是什麼?” 夫答: “這兩個是聽笑話的。”" },
  { id:"sx063", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"黃色錄影", a:"我記得我們高中的時候,班上有一個同學經常去 MTV 館看黃色錄影。 有一次,在 MTV 館裏,他突然發現坐在他旁邊的居然是物理老師,兩 人心知肚明,也有一些尷尬。 沒過多久,這哥們期中考試作弊,恰好被這個老師抓住,老師告訴 他: “考試結束以後到我辦公室來一下。” 當時我這哥們對我們說: “應該沒事,他有把柄在我手裏!” 然後把看 黃色錄影的事告訴我們。 過了半個小時,哥們哭喪著臉回來了: “他媽的,一到辦公室就跟我 說 ‘上次看黃色錄影,我已經放過你了了;這次作弊無論如何也要處理 了。’”" },
  { id:"sx064", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"牛 B 你拖走", a:"路邊停著一輛寶馬,屬違章停車。員警過來,貼條兒,抄單子。 哥們兒從商場出來: “你丫不就是員警麼,牛什麼啊?不就會貼條兒、 抄單子麼!” 員警看他一眼,沒說話,繼續抄單子。 你要真牛 B ,甭貼條兒,你直接叫拖車拖走!” 員警看他一眼,還沒說話。 “牛什麼啊!除了貼條兒嚇唬我們你們還會什麼!牛 B 你拖走!” 員警抄完單子,打電話,叫拖車。 拖車來了。員警看著那哥們兒。 “嘿,你還真牛啊!你真牛,你拖走啊!借你倆膽兒!” 員警一擺手,拖走了。 員警看他兩眼,想勸勸他,往後別這麼叫板。 哥們兒一翻白眼兒: “你牛 B ,待會兒你等車主來了你告訴他,你把他的車拖走了!”" },

  { id:"sx066", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"男人最想要的", a:"一天一個男人在路邊撿到一隻瓶子,他拿起來擦了擦,突然一個魔鬼 出現了。 魔鬼說道: “我會給你你最想要的東西。” 男人想了想,然後說道: “我想要一份特殊的工作:一份從未有男人成 功過的又沒有男人敢於嘗試的工作。” 於是,他被變成了家庭主婦。" },

  { id:"sx069", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"看那丫的還怎麼裝", a:"曹操和荀攸都在馬上。看著對方的陣式。 荀攸問: “主公,坐在車上的可是諸葛亮?” 曹操一眯眼,道: “不是他還是誰?” 荀攸點奇怪了: “不是說諸葛先生,⻑年手執一把羽扇?” 曹操終於忍不住了,道: “這你就有所不知了。二月前,我派人潛入劉 備城中,造謠說是禽流感來襲。劉備大驚,撲殺和焚燒了所有家禽。 沒有了鵝毛,又何來的羽扇?” 荀攸不禁歎道: “主公之計謀高啊!” 曹操聞之,哈哈大笑: “沒有了扇子,看那丫的還怎麼裝!”" },
  { id:"sx070", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"司馬光砸缸", a:"古時有一孩叫司馬光在花園裏玩耍時,有個小朋友不小心掉進了盛滿 水的缸裏。小朋友們慌了,司馬光冷靜的搬起塊石頭向缸砸去。缸破 了,水流出來,小朋友得救了,大家都稱讚司馬光。 第二天,他們去河邊玩,司馬光不小心落入河中,小朋友們冷靜的從 地上搬起一塊塊石頭,向河裏砸去。 司馬光卒,享年九歲!" },
  { id:"sx071", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"掛久一點就會升級成太陽", a:"連續下了十多天的雨了,百姓都盼望著晴天。 宋仁宗拍著包拯的肩: “朕決定把你懸掛在城門上。” 包拯嚇了一跳回答說: “但微臣額上的不是太陽是月亮啊!” 宋仁宗: “沒事,掛久一點就會升級成太陽。”" },

  { id:"sx073", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"你這次怎麼能睡著了", a:"爾康不敢一個人睡覺,每次紫薇回娘家他都夜不能寐。 有一次紫薇又回去,卻意外的發現沒有聽到爾康睡不著的消息。 她很疑惑,問爾康: “你這次怎麼能睡著了?” 爾康羞澀的唱到: “一個人睡我不怕不怕啦,永琪當棉被,我不怕不怕 不怕啦。”" },
  { id:"sx074", src:"司馬怕光《性笑話大全1》", cat:"性笑話大全", q:"喪家之犬更可憐", a:"我有個朋友養條狗,八年啦情感深厚,狗狗突然生病了,花了不少 錢,仍不治身亡。 她悲痛欲絕,好久緩不過勁來, 我安慰她: “狗狗先走了,也是好事,設想一下,要是你先走了,喪家 之犬豈不更可憐!” 這姐們怔忡半天,沒回過味來。 不知我這樣安慰對不對?" },

  { id:"sx143", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"第一次,痛嗎?", a:"這是你的第一次。 當你往後躺下時,你的肌肉緊繃著,你暫時把他推開想找個藉口,但 他卻不受動搖的接近你。他問你是否會害怕而你卻勇敢地搖著頭。 他有很多的經驗,但這是他第一次用他的手指找到正確的部位,他深 入時你顫抖著,你的身體緊繃著,但他溫柔的就像他所承諾過的一樣 溫柔。 他深深的看著你的眼睛告訴你必須信任他,他以前已做過很多次了。 他的微笑使你輕鬆了不少,你也張的更開使他有足夠的空間容易深 入。 你開始懇求他快一點,但他去慢慢的掌握著時間,試著讓你覺得越少 痛楚越好。當他壓的更深入時,你覺得一層薄膜破了,痛楚劇烈地傳 遍了你的全身,當他繼續時你感到一絲絲的血流出來。 他看著你,關心地問你是否覺得非常痛。你的眼睛充滿淚水但你卻搖 頭,還點頭示意他繼續。他開始很有技術地移進移出,但你現在已麻 木到感覺不出他在你裏面。 過了一段幾乎時間凍結的時刻,你感到像是有著什麼東西跑了出來在 你裏面,而他抽了出來。 你喘著大氣躺著,高興著這全都過去了。 他看著你溫和地笑著,低聲輕笑著對你說,你度過了他最頑強也最有 回報的經驗。 你笑著對你的牙醫說聲謝謝。 畢竟,這是你第一次的拔牙經驗。" },

  { id:"sx150", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"打魔獸與 ZA 的相同之處", a:"1. 每次都是 20-40 分鐘,碰上高手可以更久些。 2. 經常通宵,一晚上打 10 幾局。 3. 看別人玩不如自己玩有意思,但是看高手對戰也很有意思。 4. 開始時會聊上幾句,後來就顧不上了。 5. 經驗通過實戰得來,技巧多半是看錄影學來的。 6. 錄影看多了會很煩。 7. 越久越有趣。 8. 新的打法總是很吸引人。 9. 變態的行為可以帶來更多的樂趣。 10. 剛開始喜歡和新人玩,後來喜歡和有經驗的人玩,任何時候都和 ppmm 玩。 11. 有心得願意貼出來,就像我現在做的。 12. 搞上了就跟你丫死掐! 13. 第一次會特別緊張 ...... 不知道如何下手。 12. 最常見的是 1V1 ,偶爾 2V2，3V3 ,或有達人可 1V2，1V3 出現。 13. 手指的靈活性都很重要。 14. 高潮階段容易大聲叫喊。 15. 一般是男的比較強,偶然能見到猛女。 16 :隨著年齡的增⻑,玩的次數越來越少。 17 :老了以後就玩不動了,有心無力。" },
  { id:"sx151", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"MM 的睡姿", a:"MM 的睡姿: 新婚夫妻頭四天夜裏睡覺像四個字,” 老黃在臨下班之前大發高論。 “第一夜像 ‘非’ 字,所謂羞羞答答,所以背向而臥。 第二夜像 ‘羽’ 字,新郎畢竟臉皮較厚。 第三夜像 ‘臼’ 字,新娘已不像頭兩夜那麼害羞了,因而已有相就之意。 第四夜像 ‘日’ 字,左右上下密不通風,足證明情好纏綿了。”" },
  { id:"sx152", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"美女怕日手遮陰", a:"一日,盛暑午後,陽光刺眼,一美貌女子立於街旁,手搭涼棚,似在 找人。 來福一見,脫囗而出 “美女怕日手遮陰” 。" },
  { id:"sx153", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"性無能沒有關係", a:"有一位男士在酒吧看到一位美麗的女子,便股起勇氣去搭訕。但是這 位男士很緊張,所以講話結結巴巴的。 他說:「小.小.姐,我.我.我姓..姓...吳,能.能.能不能 和..你.你聊.聊一聊?」 小姐善解人意的回答:「性無能沒有關係,也許還有其他的辦法可以治 好!」" },
  { id:"sx154", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"讓你享受前所未有的高潮", a:"在加州歐羅維爾的一宗強暴案件中,年輕的原告對回答「在展開攻擊 之前,被告對你說了什麼?」怠到很困擾,她寧願寫在紙條上代替口 頭回答,法官同意。在筧了紙條後,法官要首席陪審員把紙條在陪審 團間依次傳遞。 有一位男陪審員從開始就在打瞌睡,突然被隔壁一位的女陪審員推 醒,並傳給他一張紙條,上面寫的是:「我要讓你享受前所未有的高 潮。」他慢慢地看,禁不住泛起微笑,然後把紙條塞進褲袋裏。當法 官要他再傳遞給下一位陪審員時,他嚴正的拒絕,說:「這是私人的 事,法官大人。」" },
  { id:"sx155", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"三個女人比 RF 大小", a:"三個女人在看完電視隆乳廣告之後,閒聊起各自的胸部。 A 女說: “我正是廣告上所說的那個不能讓男人一手掌握的女人,說實 在話,我老公兩雙手都掌握不住,可見我有多大了。” B 女撇了下嘴: “這有什麼稀奇?我那對雙胞胎女兒,小時候都是我背 著的,她們哭著要吃奶時,我只要解開上衣,把奶子這麼往後一甩, 她們都可以吃到奶了。” “嘿!這的確很壯觀,”C 女孩說: “不過比起我來,還差這麼一點,我 上回在松江路地下道遇見想要強姦我的一個色狼,把我的奶罩都拉下 來了,於是我用力把右奶向他甩了過去,當聲就把他打暈,甚至連嘴 都打歪了!”" },
  { id:"sx156", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"日本女人搓澡", a:"眾所周知,日本人習慣男女共浴,而中國人就不行。 話說抗日戰爭期間,日本鬼子來到了中國,一日本高級軍官將自己的 夫人也帶來了。日本娘們要洗澡,於是就讓一個漢奸給自己搓背。漢 奸雖然滿心不願意,但是,攝于日本鬼子軍官的淫威,不得不幹,於 是就與這個日本娘們共同進了浴池,整個浴池就他們二人。 那個日本鬼子軍官在其他屋,過了一會兒,他覺得不放心,就沖進浴 池,一看,那個漢奸正在賣力地給日本娘們搓著背,日本娘們光著身 子背對著漢奸,漢奸雙手在她背上賣力地搓著;再往下看,那日本鬼 子看見漢奸的那話兒直挺挺的翹著呢!於是鬼子大發雷霆,刷地抽出 軍刀,指著漢奸的那話兒: “巴嘎!你的,這個,什麼地幹活?!” 漢奸腦子轟地一下,不過反應很快。他馬上拿起一個毛巾,搭在那上 面: “報告太君,毛巾的掛!” 鬼子一看,覺得有理,於是就點點頭, “尤西尤西” 滿意地走了。 又過了一會兒,日本鬼子越琢磨越不是味兒,就又沖了進去,這次看 到漢奸的那玩意兒已經從背後進到日本娘們的那裏面了,還反反復複 的;日本鬼子震怒了,就又抽出軍刀: “巴嘎!這,又是什麼地幹活?” 正在賣力幹活的漢奸沒有停下,邊幹邊氣喘吁吁地大聲回答: “報告太君,外面的,搓完了;裏面的,搓搓!”" },
  { id:"sx157", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"夫婦在教堂愛愛", a:"一對新婚夫妻到義大利度蜜月。有一天來到了鄉下,突然雷雨交加且 天色已暗,一時又找不到旅館,只好跑到教堂向神父求助,希望借宿 一夜。神父勉強收留了他們,因為教堂沒有多餘的客房;只好安排在 自己臥室裏的上下鋪,神父睡在上鋪,新婚夫妻睡在下鋪。 睡到半夜,神父突然被搖晃驚醒,以為是地震便惶地問道: “噢!我的 兄弟呀!到底發生了什麼事?” 只聽道下鋪的丈未用著舒暢地聲調回答說: “沒事了!神父,只不過我 們夫妻去了一趟天堂罷了。” 於是大家又安心地唾了,可是隔了一會床又搖晃不已,這次換成下鋪 的新婚夫妻被驚醒,趕忙問道: “神父!到底發生了什麼事?” 只聽神父也用著舒暢的聲音回答說: “沒事了!只不過我自己去了一趟 天堂!”" },
  { id:"sx158", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"美麗女郎赤身勾引", a:"一個美麗的女郎,住在邁阿密海灘旅館,起床後,在睡衣上披了一件 晨褸就往化妝桌前去梳頭了,在他的鏡中,他發現了擦窗工人正在擦 窗,她決定要使那工人一個驚喜,於是她站起身來,伸直了臂,舉過 頭,很軟弱的看著他,好像是嬌慵不勝,但那工人對其視若無賭,依 然在擦窗戶。 於是她脫了晨褸,僅只穿了一件薄如蟬翼的睡衣,向前走了兩尺,接 近了窗戶,柳腰款擺,臀浪輕搖,好不惹人遐思,但那名工人仍無任 何反應,照舊工作,世界上居然有這樣不解風情的男人! 終於她連睡袍也索性脫了,全裸的立著,走到窗前,瞪著眼看那工 人,那工人將窗戶打開,說:夫人,你是不是從未見過一個擦窗的工 人?現在,窗戶打開了,看清楚一點!" },

  { id:"sx160", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"小孩買 by 套", a:"一小孩去買 by 套,說: ” 老闆,我買個 by 套。 ” 老闆一看是一小孩,沒搭理他,小孩又說:” 一個,老闆,我要買 by 套!” 老闆說:你要多大的? 小孩說:” 要特大的!” 帶著懷疑老闆給他拿了,小孩二話沒說就打開套在了頭上 ...... 老闆問:” 你這是幹嗎?” 小孩說:” 我門班辦聖誕晚會,班裏同學都有節目演,就我沒有,我去 問老師說我怎麼沒有節目演呀,老師就說,你還演,你演個 JB 你 演!! ~”......" },
  { id:"sx161", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"慾火焚身", a:"兒子問爸爸,慾火焚身是什麼意思,爸爸便委婉地告訴他是某人想要 什麼東西的意思。 語文課上沒有粉筆,年輕的女老師剛好自己要去取時,兒子就立刻站 起來說; “老師,我知道你是慾火焚身,還是讓我滿足你吧 ~”" },

  { id:"sx164", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"校園採花經歷", a:"一採花賊,專在校園中侵襲女生。 一次,脅持一 “大一” 女生,女生奮力抵抗,狂叫驚呼,採花賊心虛, 沒有得逞。 一次,脅持一 “大二” 女生,女生低聲求饒:別 ... 、不要、不要 ... 。採 花賊強行得手。 一次,脅持一 “大三” 女生,女生同樣低聲求饒:別 ... 、不要、不 要 ... 。採花賊強行非禮,正要插入,女生突然冷靜道:等一下,先把 這個戴上。隨手遞過一個保險套。 ...... 一次,挾持一 “大四” 女生,女生並不喊叫,只遞過一個保險套,然後 鎮靜道:先戴上,不要太粗魯了。 ...... 一次,挾持一 “女碩士研究生” ,女研究生遞過一聯保險套,輕生道: 一次換一個,這是十二個,夠了吧。 ....... 採花賊一個月不能直腰走 路,校園相對穩定了。 又一次,挾持一 “女博士生” ,女博士莫不作聲,隨採花賊肆意姦污。 事閉,整理好衣物,遞過一把鑰匙和一個名片,道:這是我宿舍公寓 的鑰匙和手機號,你可以隨時找我。 ...... 終於有一次,脅持到一 “女博士後” ,女博士後同樣莫不作聲,隨採花 賊肆意姦污。事閉,清理好衣物,自言自語道:作愛原來是這個感 受,不過如此,遠沒有手淫刺激。 ......" },

  { id:"sx186", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"怎麼膿都吸出來了!", a:"有一個鄉下小夥,第一次進城,看看到街上花花綠綠的美女廣告,身 體就起了反應,他以為自己病了,急忙來到醫院,對醫生說: “醫生, 救救我,我這個腫了。” 醫生看了看,覺得很好笑,又不便說明,就對他說: “沒關係,吃點藥 就好了。” 於是隨便給他開了一些藥吃了,小夥吃了藥,過了一會,果然好了, 於是第二天又上街了。 結果又出現了昨天的情況,急忙又來到醫院,可是昨天的醫生不在, 只有一個護士,他於是將病情向護士講述了一遍,護士聽完,笑了 笑,徑直把他帶進病房,過了一會,小夥出來了,正好見到醫生回 來,就對他說: “你是什麼醫生,隨便給我開了一點藥就把我打發了, 太不負責了,哪像這位護士小姐,連膿都給我吸出來了!”" },

  { id:"sx213", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"生理課男女生都想問的問題", a:"在一個班級裏,正在上一堂生理課女老師剛講完,就問:同學們,誰 還有不明白的地方,就可以舉說問老師。 這時有一個同學就把手舉起來了。問老師: “老師啊,在 ZA 的時候, 是男人舒服一些?還是女人舒服一些啊?” 老師給她說了大半天。但他還是不明白。老師就給她做一個比喻。 說: “那你用你的手摳你的鼻子,是鼻子爽?還是手爽那?” 他一想。 嗯。是鼻子爽!就坐下了。 老師問,還有沒有同學有不明白的地方,可以舉手問老師。然後那個 同學又把手舉起來了。 問老師: “老師,為什麼女人來了月經。就不能 ZA 那?” 老師又給她做了一個比喻。說: “那你鼻子出血的時候。你還用你的手 摳你的鼻子嗎?” 學生一想,嗯,也是啊! 不一會,他就又把手舉起來了,問老師一個問題,老師。 “既然女人比 男人舒服多一謝,為什麼男人強姦女人的時候,女人都要反抗呢?” 老師一生氣,叭地一拍桌子,說: “你在大馬路上遛噠的時候。別人過 來摳你鼻子。你願意嗎啊〜" },
  { id:"sx214", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"打鳥費用", a:"有個來城市上大學的農村大學生,因為窮,沒女生願意做他女朋友, 農村窮學生就去嫖妓。 這樣一來,每個月就要多出些嫖妓的費用,這筆費用怎麼向家家交代 呢? 好在窮學生的爸爸是個開明的父親,很理解兒子的苦惱,同意兒子每 月去嫖妓幾次。 窮學生每月寫信給爸爸,列出當月的開銷,並索要下月的生活費用。 “嫖妓費用 XX” ,寫在信上怕人見到不好,父子倆就商定用 “打鳥費用 XX” 來代替 “嫖妓” 這個詞。 一般來講,兒子每月寫給爸爸的信中,關於 “打鳥費用” 都是 150-200。一次,爸爸去信給兒子,說最近家家更緊張了,讓兒子能不能找 “便宜 點的鳥” 打? 結果,第二個月兒子寄來的信中寫道 “打鳥費用: 50 塊” 。爸爸一看, 高興極了,這次果然少了許多。 但爸爸朝下一看,驚呆了,只見信下面寫著: “修理鳥槍費用: 2500 塊” 。" },
  { id:"sx215", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"張飛學 ZA", a:"話說張飛結婚,張飛比較傻,不明白 ZA 應該怎麼做,便去問諸葛亮。 諸葛亮想: “要是說深了吧,他聽不懂,要是說淺了吧,就顯得我太低 俗,怎麼辦好捏?” 此時,正好有兩匹馬正在河邊交配,諸葛亮眼一亮,有了,就對張飛 說: “你看見那兩匹馬沒有?看見它們怎麼做了嗎?回去這樣子做就可 以啦。” 張飛便回去了。幾日後,諸葛亮見到張飛,問道: “翼德,性生活如何 阿?” 張飛答道: “好是好,不過 ......” 諸葛亮道: “不過什麼?” 張飛道: “就是在河邊做有時候太冷了,還有人偷看。”" },
  { id:"sx216", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"如何洞房", a:"從前在一個保守又封閉的鄉下,有對新人結婚了,但是卻不知道如何 行房,懷孕,以及生子,於是太太便偷偷的問媽媽怎麼作愛,媽媽便 偷偷塞了一片日本 A 片給女兒,於是便心滿意足的等著好消息。 沒想到,三年過了,女兒仍沒懷孕,於是媽媽便偷偷找女兒來問, 媽: “女兒,媽給你的 A 片你有照著作嗎?” 女兒: “有啊!” 媽: “那你怎麼沒懷孕呢?好,你找你丈夫來作一次給我看。” 於是夫婦兩便很努力的在媽媽面前做了起來,最後,丈夫再很舒爽的 射在太太的臉上 ......" },
  { id:"sx217", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"誰偉大?", a:"你知道世界上那種男人最自大? ── 德州牛仔與蘇俄獵人! 有一天,一個德州佬與一個蘇俄獵人同在西伯利亞的一間小酒吧裏喝 酒,室外冰天雪地,室內溫暖如春。喝著喝著,倆人就開始抬杠,互 相吹噓自己是世界上最強壯的男人;吹著吹著,倆人火氣上冒,眼看 就要開扁,酒保看到苗頭不對,就跑出來勸架說 ∶ 「你們再吵下去也沒 有結果,不如一人出去作一件事,證明自己是世界上最強壯的男人, 贏的人由我請喝酒。」 俄國獵人說 ∶ 「這是我的地盤,我先去。」馬上就很英勇的 ␀ 出去 了 ......。過了大約半個小時,俄國獵人歪歪斜斜的回來了,衣衫不整,血痕斑 斑,往吧臺上一靠 ∶ 「拿酒來,我贏定了」 「且慢!」德州佬說 ∶ 「你作了什麽事?」 『我空手打敗了一隻北極熊!』 德州佬一聲不響,回頭就出了出去; ......。這一次過了一個鐘頭才看到德州佬跌跌撞撞的回來,沿路滴血,簡直 體無完膚,往吧臺上一趴 ∶ 「酒來!這回我贏定了,」 「且慢!你做了什麽事?」俄國獵人問。 德州佬很得意的回答 ∶ 『我 XXX 了一隻北極熊!!』" },
  { id:"sx218", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"瘋狂精子的故事", a:"一群精子都想早日成人,一日終於有了動靜,便蜂擁而出,快到門口 時一老精子大喊道: “兄弟們快撤!我們上當了。那個又在打手槍!”" },
  { id:"sx219", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"10 %的處女", a:"頑固的教授看不慣時下年輕人的愛情觀,在課堂上發表言論: “最近有 篇報導,我國的成年女性有 90% 不是處女,總統先生對這種事實感到 不可思議,因此寄信給其他 10% 保有處女之身的女性。各位女同學, 你們知道總統信中寫些什麼嗎?” 大家都搖頭說不知道。 “真的你們都不知道!” 教授說: “那麼,你們都沒有收到信了。”" },
  { id:"sx220", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"兒子的情色日記", a:"老王規定其兒子每天要記日記,某天晚上他要抽查兒子的日記。 他查完日記後,對兒子的母親大發雷霆。 其妻莫名其妙,要求老王說明原因。 他憤怒地打開兒子的日記攤在桌前,其上歪歪扭扭地寫著: “今日陳叔 叔來我家玩媽媽,說做完作業後,可以吃點心。然後,陳叔叔誇我作 業做得好,於是叔叔抱起了我媽,媽叫叔叔小心一點,之後叔叔又親 了我媽媽,也親了我奶奶,也親了我。 妻大怒,斥問兒子,兒子哭道: “是我把標點點錯了, ...... 應該是 “今日 陳叔叔來我家玩,媽媽說做完作業後,可以吃點心。然後,陳叔叔誇 我作業做得好,於是叔叔抱起了我,媽媽叫叔叔小心一點,之後叔叔 又親了我,媽媽也親了我,奶奶也親了我。”" },
  { id:"sx221", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"一名妓女的周記", a:"星期一,晴 一個新的禮拜又開始了。但今天的開局頗為的不順,接了一個進城賣 棉花的農⺠。他身上不僅帶著那典型的農村泥土的氣息還有糞便的餘 味,更討厭的是有很多的棉絮粘在他的身上,讓我這過敏的鼻子又受 了一通罪。晚上洗了三次澡,感覺和豬睡了一回。 星期二,陰天 今天很意外的來了一個大學生,大約也就二十多點。⻑的倒是眉清目 秀的,我也挺喜歡。現在的大學生真是苦啊,青春最激昂的階段得不 到性的歡娛,大學的體制真的是應該改一改了。他明顯是個雛,我有 心讓他快樂,使出了渾身解數。他似乎很高興,給了我 200 塊錢。呵 呵,真是個雛。 星期三,晴 今天很倒楣,接了一個七十多的老頭。男人真的可怕,棺材板都咚咚 響的人了,還整天想這個東西。他在我身上磨了半天,嘴裏不停的嘟 囔著,很興奮的樣子。也難怪,這麼個老頭,也不知道忍了多久了。 星期四,多雲 男人真的不可理解。今天來了一個中年男人,西裝革履,挺有氣派 的。他說他老婆對他很好,也很漂亮,但是就是引不起他的興趣,反 而喜歡找我們這樣的。既然送上門來,不宰白不宰,我向他要了 500 ,他居然眼都沒眨一下就給我了。唉,真羡慕他的老婆。 星期五,小雨 下起了小雨,心情也不是很好,但是沒有辦法,生意還是要做的。今 天來了一個員警,說實話,這樣的人最不好伺候了,弄不好還要倒 貼。這個員警原來跟我們老闆娘是很熟的,說以後做生意不要怕,有 他罩著呢。說的倒是好聽,辦完事卻不給錢,我也不敢向他要,得罪 了他,估計我的飯碗也保不住了。 星期六,多雲 今天這個客人,是做網路的。現在這樣的人是很風光的,他跟我大談 特談網路經濟,說以後的網路時代是多麼美好。雖然我也偶爾上上 網,聊聊 Skype ,但說實話我對他講的這些倒是沒有什麼興趣,只要 辦事給錢就行了。沒想到這個王八羔子弄完後,只給了我二十塊,說 現在 IT 不好做,先欠著,以後光景好了再來找我,把我氣的夠嗆。 星期天,晴 終於出太陽了。今天又是星期天,忙活了一個星期,今天做完終於可 以休息一下了。很幸運,這個人說他是糧食局的頭頭。這些當官的, 不僅公款大吃大喝,還公款。。。我下決心狠狠的賺一筆。沒想到這 傢伙真厲害,估計是玩的不少,經驗技巧都很嫺熟,把我搞的迷迷糊 糊的。醒來後他已經走了,我四處找錢,原來是在臺燈下壓著,拿起 一看,靠,是張白條!這個星期白幹了,下星期還得忙!" },

  { id:"sx224", src:"司馬怕光《性笑話大全2》", cat:"性笑話大全", q:"你看到什麼了?", a:"一輩子都在務農的老王, 60 多幾了,身體依然硬朗,這天下午忙完了 田裏的工作,來到溪邊洗澡,突然想起過世多年的老伴,一時「性」 起,當場 DIY 起來。 結束之後,老王隨便手摘了片樹葉,把手上精液給擦了乾淨,然後把 樹葉丟到溪水中,口中喃喃自語地念著「唉!如果你老母還在人世, 那你就是老三了」。 話才一說完,轉個身,突然發現大媳婦就站在他身後,儘管尷尬萬 分,但老王仍然很鎮定地問媳婦「你什麼時候來的?有沒有看到什 麼?」 起初大媳婦低頭不語,最後想了一下,吞吞吐吐地回答說「我 ... 我 ... ,剛剛看到『三叔』坐船走了 ...." },

  { id:"sx260", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"為什麼德國戰敗呢?", a:"話說二戰期間,英德交戰。可英軍總敗於德軍手下,一天,英軍派出 一個間諜到德軍基地。此間諜發現德國軍紀十分嚴明,特別是連上廁 所都要統一安排。上廁所時,一個指揮官帶大軍到一片曠野,排好佇 列。 指揮官喊: 一,軍人們拉開拉鏈。 二,掏出雞巴。 三,翻開包皮。 四,尿。 五,放下包皮。 六,放回雞巴。 七,拉上拉鏈走人。 此間諜掌握此機密後大喜。第二天,在德軍上廁所時,他把那個指揮 官殺了,自己扮成指揮官。 在上廁所時,他喊: “一,二。” 軍人們都照做了。 於是他喊到: “三和五連起來做一千遍。”........ 這時,英軍發起了進 攻 ..... 結果可想而知,德軍慘敗。" },

  { id:"sx271", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"妓女們的口號", a:"某國進入總統大選,選票拉到了一個很大的城市。一位總統候選人的 智囊團對他出主意,讓那些妓女也來投票。妓女們紛紛贊成。但是, 妓女群體畢竟不同於工會組織之類,大家都怕出差錯,特別是在遊行 時喊口號出錯。於是,智囊團建議審查遊行口號。 等到遊行那一天,城市的各局⻑負責審理妓女隊伍的標語口。 只見妓女 1 隊伍的標語口號是: “一不偷,二不搶,三不反對執政黨。” 安全局⻑見了,高興地說: “行啦,行啦!” 只見妓女 2 隊伍的標語口號是: “不占地,不占房,只是用了一張床。” 國土局⻑見了,高興的說: “好咧,好咧!” 只見妓女 3 隊伍的標語口號是: “不生女,不添男,不給政府添麻煩。” 人口局⻑見了,高興的說: “不錯,不錯!” 只見妓女 4 隊伍的標語口號是: “無噪音,無污染,只是偶爾喊一喊。” 環保局⻑見了,高興的說: “你們喊吧,你們喊吧 “。 只見妓女 5 隊伍的標語口號是: “無資金,無貸款,自帶設備搞生產。” 開發局⻑見了,高興的說: “歡迎,歡迎! “只見妓女 6 隊伍的標語口號是: “下崗妹,別流淚,跟我走進夜總會。” 社保局⻑見了,高興的說: “總會,總會 “。 只見妓女 7 隊伍的標語口號是: “雖舒服,也勞累,拉動內需創外匯。” 經貿局⻑見了,高興的說: “拉吧,創吧! “只見妓女 8 對伍的標語口號是: “災不招,禍不惹,堅決不當第三者。” 婦聯主任見了,高興地說: “省心,省心!” 只見妓女 9 隊伍的標語口號是: “一不偷,二不搶,注重信譽抓市場。” 工商局⻑見了,高興地說: “提倡,提倡!” 只見妓女 10 隊伍的標語口號是: “醜不嫌,老不怕,培養幹部責任 大。” 組織部⻑見了,高興地說: “謝謝,謝謝!” 只見妓女 11 隊伍的標語口號是:不管老,不管小。堅決實踐 “三個代 表”。宣傳部⻑看了,高興地說:挺好,挺好。" },
  { id:"sx272", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"做功課", a:"十五歲的小明放學回來,姥姥問: “今天學了些什麼?” 小明答: “生理衛生。” 姥姥不明白,小明就告訴她老師講的是生殖系統、女生月經、男生遺 精什麼的。 姥姥私下問小明的媽媽: “現在的孩子還學這個?” “是啊,這是學校的一門功課。” 媽媽答。 小明回自己房間去了,媽媽和姥姥在廚房做飯。飯做熟了,姥姥推開 小明的房門,看見小明躺在床上,正在用手 “自慰” 呢!姥姥慢悠悠地 說: “乖孫子,做完功課就來吃飯啊。” 然後把門關上了。" },

  { id:"sx287", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"成人之對", a:"古代,有一種官吏叫典史,某地一位典史在一廟內與一個和尚下棋, 由於棋逢對手,打了一個平局。 和尚想抬高自己貶低典史,就出了一個主意:要以對對子定輸贏和尚 先出了上對:男人站著撒尿,蹲下,雞巴點屎(典史)。 典史毫不示弱對到:女人蹲著撒尿,站起,臊逼合上(和尚)。" },

  { id:"sx329", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"讓你壓死俺養的小青蛙", a:"小孩進到一家五星級賓館後找來服務員說: “把你們經理給俺找來。” 服務員說: “對不起,經理不在。” 小孩拍出 500 元錢說: “把你們經理給俺找來。” 服務員立刻找來了經理。 “俺找個小姐。” 小孩說。 “我們是五星級賓館,沒有什麼小姐。” 經理說。 小孩拍出 5000 元錢說: “給俺找個小姐。” 經理立刻給小男孩找來一排小姐讓他挑。 “給俺找個帶病的。” 小孩說。 “我們是五星級賓館,沒有帶病的。” 小孩拍出 5000 元錢說: “給俺找個帶病的。” 經理又立刻給小男孩找來一排帶病的小姐讓他挑。 小孩隨便找了一個和她搞了一通。 第二天小孩找來經理問道: “俺和那個帶病的搞了一通,那俺也帶病了 吧?” 經理不知道小孩葫蘆裏買的什麼藥,就說: “沒,沒,沒。” 小孩拍出 5000 元錢說: “說,俺是不是肯定帶病了?” 那沒跑兒啊! ~ 肯定帶,肯定帶! ~ 經理收起錢激動地說。 “那俺回去和俺們家小保姆搞上一通,那俺們家小保姆也肯定帶病了 吧?” “那沒跑兒啊! ~ 肯定帶,肯定帶!” “那俺們家小保姆和俺爸搞一通,那俺爸也肯定帶病了吧?” “那沒跑兒啊! ~ 肯定帶,肯定帶!” “那俺爸和俺媽搞上一通,那俺媽也肯定帶病了吧?” “那沒跑兒啊! ~ 肯定帶,肯定帶!” “那俺媽和俺們家司機搞上一通,那俺們家司機也肯定帶病了吧?” “那沒跑兒啊! ~ 肯定帶,肯定帶!” 小孩一拍桌子罵道: “媽的司機!讓你壓死俺養的小青蛙!!!!!”" },
  { id:"sx330", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"中獎", a:"陳先生是一家賣場的老客戶,⻑久以來,他都可以用賣場送給他的優 待券來購物。 陳先生又去購物時,賣場告訴他,優待券已經停發了。陳先生十分生 氣,就讓職員把經理叫來。 經理拿來了一本新的摸彩券,告訴陳先生這是他們優待老客戶的新辦 法,只要中了幸運號碼,就可以和本公司的 ‘公開少爺’ 和 ‘專櫃小姐’ 免 費 ZA 一次。 可是陳先生不為所動,認為這只是廣告上的噱頭罷了,不如優待券來 的實惠。他說: “你以為我會相信這些廢話嗎?這不過是騙人的把戲罷 了!” 經理一笑,強調說: “是百分之百的真話,您要是不信,可以回家問問 您太太,她上個星期中獎兩次呢!”" },
  { id:"sx331", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"中國人和日本人的對話", a:"一個日本人在中國一家飯店裏吃飯。當侍者端上一盤龍蝦後,日本人 問道:請問你們怎樣處理吃剩的蝦殼? 當然是倒掉啦,侍者道。 NO ! NO ! NO !日本人搖搖頭說, ‘在我們日本,吃剩的蝦殼就送進工 廠裏,做成蝦餅,然後再賣到你們中國。 ‘一會兒,侍者又端上了一盤水果,日本人指著其中一個檸檬又問: ‘請 問你們怎樣處理吃剩的檸檬皮? ‘‘當然是倒掉啦, ‘侍者道。 ‘NO ! NO ! NO ! ‘日本人搖搖頭說, ‘在我們日本,吃剩的檸檬皮就送 進工廠裏,做成果珍,然後再賣到你們中國。 ‘結帳的時候,日本人一邊嚼著口香糖,一邊笑著問侍: ‘請問你們怎樣 處理吃剩的口香糖? ‘‘當然是吐掉啦, ‘侍者道。 ‘NO ! NO ! NO ! ‘日本人搖搖頭,得意的說, ‘在我們日本,嚼過的口 香糖就送進工廠裏,做成套套,然後再賣到你們中國。 ‘侍者不耐煩的問道: ‘那你知道在我們中國,如何處理用過的套套嗎? ‘‘當然是扔掉啦。 ‘日本人道。 侍者搖搖頭說: ‘NO ! NO ! NO !在我們中國,用過的套套就送進工廠 裏,做成口香糖,然後再賣到你們日本。 '" },
  { id:"sx332", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"老公職業和那個的關係", a:"四個女人在一起談論自己丈夫的能力。 派送傳單的妻子說: “我老公就像派送宣傳單一樣,隨便一塞便了 事。” 賣羊奶的太太接著說: “你還好呢!我那口子就像送羊奶一樣,只放在 門口就走了。” 管理員的老婆說: “唉!我家那死鬼就像收管理費一樣,一個月只來一 次。” 冰淇淋的老婆說: “你們都沒有人悲慘,我家那個只是好看,一碰就融 化了。”" },

  { id:"sx334", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"小約翰的好奇心", a:"小約翰 12 歲了,像所有的同齡人一樣,對所有的事都有好奇心。他從 別的孩子裏那裏聽到了 ‘求愛’ 這個詞,便回去問媽媽。 媽媽對他千奇百怪的問題早就煩的不得了,也懶得解釋,只是讓他晚 上偷偷站到窗簾後面看他姐姐和姐姐的男朋友怎麼做。 小約翰照辦了,第二天一早,便迫不急待地向媽媽詳細地描繪他所見 到的一切。 “姐姐和她的男友先是坐在那兒談了一會兒,然後他把大部分的燈都關 了。開始吻她,摟她。我猜姐姐一定是病了因為她的表情很可笑。他 肯定也是這樣想,所把他把手伸入姐姐的襯衣裏測試她的心跳,像醫 生做的那樣,只是他沒有醫生聰明,總是找不准她的心臟。 我猜他可能也病了,因為不到一會兒,他們兩個都氣喘吁吁。他的另 一隻手肯定很冷,他把手伸進姐姐的裙子裏。這時姐姐似乎病情加重 了,她不斷的呻吟、歎息,慢慢地倒到床上。這就是她剛發燒時的情 況,我知道她在發燒是因為姐姐告訴他說她渾身發熱,好象有火在燃 燒。 最後我總算看明白是什麼讓他們那麼難受了 —— 一條大鱔不知道怎麼 跑到他的褲子裏去了。它從那兒跳了出來,直直地站著,大概有 10 英 寸⻑,我不騙你,他一把抓住它,以防它逃跑。 姐姐看到鱔魚嚇了一大跳,她的眼睛瞪圓了,嘴張大了,她開始呼喚 上帝,她說這是她見過最大的,我真該讓她看看我上次從湖裏抓到的 那條,那才真叫大呢! 不過姐姐倒是真的很勇敢。她想把鱔魚頭給咬下來。忽然,她緊緊用 手抓住了鱔魚,而他則從褲兜裏掏出套子給鱔魚套上,以防它咬人。 姐姐躺下把腿變成剪刀,想把鱔魚剪死。 鱔魚進行了一番掙扎。姐姐開始呻吟,尖叫,她男朋友差點把床都弄 翻了。我猜他倆是想把鱔魚給擠死。 過了一會兒,他們都不動了,⻑歎一聲。她男朋友站起來,鱔魚被殺 死了,我知道是因為它軟軟地掛在那兒,連膽汁、內臟都出來了。 因為戰鬥,姐姐和她男友都有點累了。但他們又返回到開始的樣子。 他吻她,摟她。天啊,那條鱔魚沒有死!它又直直地跳了起來,重新 戰鬥。我猜鱔魚可能和貓一樣有九條命! 這次姐姐跳了起來,想把它坐死。35分鐘的搏鬥後,他們終於殺死 了鱔魚。我知道它死了是因為我看見姐姐的男朋友把它的皮剝了,扔 進了廁所裏。”" },
  { id:"sx335", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"村兒裏又來新人了", a:"剛畢業時,到一個偏遠的小山村蹲點。那個小山村不大,總共也就六 七十戶人家。大隊書記是個老復員軍人,在村裏當了將近二十年的書 記了。小山村地處偏僻,山高皇帝遠,所以村裏的大事小情基本都是 老書記說了算,故而老書記在村裏的威信相當高。 有人的地方,可能就有不平,誰家沒個求人事?人們為了達到自己的 目的,會不惜一切代價。於是很多女人為了得到老書記的關照,便拿 出了獻身精神。久而久之,村裏成年以上的女人都與老書記有染了。 俗話說近朱者赤,近墨者黑。老書記的兒子在老書記的影響下,仗著 其父的權勢,也與村裏的個別女人有染。起初女人們對小的敢怒不敢 言,後來看到給小的獻身照樣能得到好處,於是主動投懷送抱的人遂 漸多了起來,時間⻑了,這小的竟也將村裏的成年女人全部拿下。兒 子將女人們玩夠後,不免想在其父面前顯巴一下。 一日,兒子在一漂亮女人處回來後,不無得意地問其父: “你猜我今兒 個上哪兒啦?” 不想老書記連頭都沒抬: “不就是張家新娶的三媳婦嘛!” 兒子聽了驚詫不已,難道父親跟蹤我了?於是下次便加了萬分小心。 可到家一問,老書記照樣不動聲色: “李家老二,有什麼樣大驚小怪 的?” 兒子心想真神了,他怎麼知道的呢?這次兒子找了個年齡較大的女 人。沒想到老書記還沒等兒子開口,便說上他了: “你真沒出息,連 40 多歲的王柱媳婦你也要!” 兒子這回對父親佩服得可說五體投地了。 這天,兒子想同父親開個玩笑。於是,他在母牛後面蹭了幾下便回家 了。見到父親後問: “你說我上誰家了?” 老書記繞兒子轉了一圈後,兩眼頓時放光: “難道村兒裏又來新人 了?”......" },
  { id:"sx336", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"女廁所裏都有些啥?(完整版)", a:"有一位男士坐在一台最先進的豪華噴射客機,突然肚子劇痛,要拉肚 子 .... 但所有的男士專用廁所都客滿。但他實在憋不住了,於是跟空中 小姐拜託,讓他用一下女生廁所。 空中小姐有點為難,但還是答應讓他去上,還很擔心一再交待他不要 碰任何東西,拉完肚子就趕快出來。 於是他一陣慌亂進去女生廁所。當他拉完後,神情一陣輕鬆 ... 發現馬 桶旁有三個按鈕,分別寫著 HW 、 HA 、 ATR ,他很好奇;想想這麼先 進的廁所一定有什麼特別之處,但又想起空中小姐的叮嚀 KK 。不過, 還是很好奇,於是按了第1個寫著 HW 鈕 ...... 咦!竟然從後面噴出清潔屁屁的熱水。好棒!原來是 Hot Water 之意。 他心想,真高級!連忙看第2個鈕 ... 寫著 HA 應該就是 Hot Air 囉!果然 按下鈕後,送來徐徐熱風。 真有意思!!那第3個寫著 ATR 到底是什麼意思? 於是他按下第三鈕 ...... 突然一陣劇痛 ......$@#& ! * ,兩眼發黑暈眩了 過去 ...... 當他醒來時已在醫院,護士小姐面色凝重的看著他說:先生,你醒 了!這是你的 xx 我把它放在你的枕頭旁,希望你節哀! “哇哇哇!我的 xx ! ...... !怎會這樣?” 他大叫: “我不是在上廁所嗎?怎麼會這樣?” 先生,空姐說你誤觸了 ATR 鈕,那是 Automatic Tampon Remover= 衛 生棉條自動拔除。" },
  { id:"sx337", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"妻子的抱怨", a:"妻子去看醫生說: “我有點問題需要您幫忙,醫生。” “每次我們在床上的時候,我丈夫一到高潮,便要發出震耳欲聾的叫 聲。” 醫生回答說: “這很正常,我不認為這有什麼問題。” “問題就在這兒了,” 妻子報怨道: “他總把我吵醒。" },

  { id:"sx340", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"最強悍的", a:"鋸木工阿卡在週末走進城裏的妓院,要找妓院裏最強悍的。 “那是蘇珊!” 老鴇說: “你先上樓去,我馬上叫她上去。” “讓她帶兩瓶啤酒來。” 阿卡在樓梯上喊。 不多久,蘇珊帶兩瓶啤酒出現了。她迅速脫光了衣服,並以膝、肘著 地,擺好的姿勢。阿卡不滿地大叫: “到床上去,而且不要這種新的姿 勢。” “當然可以,” 蘇珊委屈地說: “但我以為要先開啤酒瓶的蓋。”" },
  { id:"sx341", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"浪漫激情男女做生意", a:"一對浪漫激情的男女在幽暗的咖啡座裏依偎在一起。女友用手輕摸男 友的 ‘東西’ 問: “這是什麼?” “這是男人的本錢啊!” 男人驕傲地回答後,也摸摸女友的 ‘那兒’ 反問 道: “這又是什麼?” “這是店鋪嘛!” “這太好了,又有本錢又有店鋪 ...... 你把店鋪借給我,我們一起做生意 好不好?” 女友同意了,於是立即開張,日以繼夜的做生意。 終於有一天男友精疲力盡地說: “喂!這樣不行,我的本錢越來越小, 你的店鋪卻越一越大了。”" },
  { id:"sx342", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"虞美人", a:"一男人妻子是 ‘大食國’ 的,天天要,日日討,弄的他日漸瘦弱,心中恐 慌。 一日,他老婆又說 ‘想要’ ,再也忍不住了,便模仿李後主的 ‘虞美人’ 作 詞一首,送給他老婆。 顛鸞倒鳳何時了 交貨知多少 每晚都來馬上風 上陣嬌你就似一夢中 少女羞態應猶在 忽然牛顏改 問卿可知我憂愁 恰似一缸東水向X流!" },
  { id:"sx343", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"騎駱駝", a:"法國駐外部隊新來了位司令員,隊⻑帶他四處參觀。司令員看到那個 有個小小的屋子就問: “那個小房子是用來幹什麼的?” 隊⻑說: “⻑官,你知道這附近沒有女人。不管什麼時候士兵們感覺自 己需要女人了,便去那兒用房子裏的駱駝 ......” “夠了!” 司令員憤怒地制止住了隊⻑的解釋。 兩個月後,司令員自己也開始覺得需要女人。他找到隊⻑壓底了聲音 問: “隊⻑,能不能告訴我最近駱駝有空嗎?” 隊⻑查了一下告訴他下午兩點駱駝有空。 下午兩點的時候,司令員走進那座小房子,打開門,裏面是一頭他從 未見過的最漂亮的駱駝。駱駝旁邊臉皮噔腳的小凳子。他關上門,站 在駱駝後的凳子上,脫下褲子 ...... 正在這時,隊⻑在說: “⻑官,對不起,打擾了,可您不覺得像其他人 那樣,騎駱駝進城找女人更好一點嗎?”" },
  { id:"sx344", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"誰來開計程車", a:"一位媽媽搭計程車要去接國中的女兒。母女兩人經過某路段,只見一 個個打扮妖豔的阻街女郎開始站在路旁「做生意」。 正值青春期的女兒好奇的問:媽媽,那些女人站在路旁幹什麽? 為了不影響女兒幼小純真的心靈,媽媽回答說:那些女人在等老公。 多嘴的計程車司機卻在一旁搭腔:笑死人了,誰都嘛知道那些女人是 妓女。 媽媽狠生氣鄧了司機一眼。 女兒接著問:媽媽,那 j 女會不會生小孩。 媽媽冷冷的道:當然會啊,要不然誰來開計程車!" },
  { id:"sx345", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"它叫什麼?", a:"有一個想娶妻,考慮到自己 YJ 太小怕人恥笑決意娶一個處子。告知媒 人不是處女就是退婚。 初夜上床出示 YJ 問妻是何物? 答: “YJ 。” 一氣之下退婚。又娶一女,仍問,答: “香腸。” 更氣又退。又娶一女,照問,答: “不識。” 此人十分高興想:必定是處女了。於是指其說: “此名為 YJ 。” 妻不解搖頭不止: “不對不對,我也是看過許多了,不相信世上有如此 細短的 YJ 。”" },
  { id:"sx346", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"這傢伙像什麼", a:"夫妻行房,夫在上妻在下。高潮後問妻子: “我這傢伙像什麼?” 妻子答像一個瓢子,把壇裏的好酒都舀出來了。一會又交合,妻在上 夫在下。 妻問: “你那傢伙又像什麼?” 夫答: “像一把破傘。” “傘就傘怎麼還是破的?” 妻子不解。 “如果不是破傘,為什麼從傘柄上流下水來。” 夫笑笑答。" },
  { id:"sx347", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"男生宿舍和女生宿舍的下水總管是不是要分開?", a:"大學生活中最令人難忘的就是晚上熄燈後的談論。一天晚上,某宿舍 A 君從水房姍姍回屋。問了一個問題: “你們說學校男生宿舍和女生宿 舍的下水總管是不是要分開?” 大家納悶: “當然要匯合到一起一個學校只以有一個下水總管。” A 君疑惑道: “不會吧!如果匯合到一處,那裏面肯定全都是人!”" },
  { id:"sx348", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"ZA 與騎自己行車的相同點", a:"ZA 與騎自己行車的相同點: 1 、你不用也可以,可一定要很有經驗才可以嘗試。 2 、你可以自己來,但一般來說不會太有意思。 3 、在頭幾次,你很難控制好速度。 4 、你不需要任何特別服飾,但如果你真的進去了,你還是需要一 些。 5 、如果你的同伴趕不上你,你一定要慢下來等她。 6 、轉向之前一定要發出信號。 7 、確保要抓牢。" },

  { id:"sx357", src:"司馬怕光《性笑話大全3》", cat:"性笑話大全", q:"成人笑話", a:"一農夫買了幾頭豬,希望養大後,可以做火腿和醃肉,數周後,他發 現沒有一頭豬懷孕,於是就打電話請獸醫幫忙,獸醫告訴他要採用人 工受精。 農夫根本就不知道那是什麽意思,但又不想讓別人看出自己無知,所 以他只問了獸醫如何才能看出豬懷孕了。 獸醫說,只要看到豬在泥漿裏躺下來並不停打滾,就說明它們懷孕 了。 農夫掛了電話,思討了一下,得出的結論是:人工受精就是要他給這 些豬受精。於是他將這些豬悉數裝上卡車,拉倒小樹林裏,並挨個把 它們幹了一遍,完事後,又把它們全部拉回來。 第二天醒來後,農夫走到豬圈,看到豬都仍一個個站在那裏,他想, 肯定是第一次沒有成功,於是他又用卡車把豬拉到小樹林裏,這次, 為了保險起見,他很賣力地將它們各幹了兩次。 第二天一早,他起身到豬圈,發現豬還是站在那裏,沒動靜,他心 想,在試一次吧,於是又把豬裝到卡車上拉到小樹林裏,用了整整一 天的時間,一遍又一遍地挨個幹這些豬,回到家裏,累得一頭倒在床 上,昏睡過去。 第二天,他幾乎起不了床了,於是讓他老婆去看看豬是否都已經躺在 泥漿裏了。他老婆回來告訴他: “不,豬全都跑到了卡車上了,其中一 頭還在不耐煩地用嘴巴按喇叭呢。”" },

  { id:"sx451", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"床上高爾夫球守則", a:"1 ,球員須自備球具,通常為一杆兩球,球場有三洞,上、前、後各 一。 2 ,進入球場打球前,須經場主同意,違者可能遭⺠法或刑法訴訟。 3 ,與室外高爾夫不同,目標是將球杆插入球洞而將球擺於洞外。如 果球洞仍有空間,將球放入球洞,在場主同意範圍內,不算違規。 4 ,為了讓賓主盡歡,球杆應越硬越好,場主得以予打球前檢查球杆 的硬度。熱情的場主可能建議球員先打上面球洞暖身,測試球杆硬 度。 5 ,為了避免對球洞造成破壞,場主得以限制球杆插入球洞⻑度。 6 ,另一目標是敲越多杆越好,直到場主滿意為止。缺乏運動精神者 (諸如敲沒幾杆就棄械停戰),可能被場主宣告終身禁止進入球場打 球。 7 ,一到球場就立刻揮杆入洞,也被視為另一種沒運動精神的表現。 老手通常會先到整個球場四處遊走觀看,對於突起的高地及草叢特別 予已注意。 8 ,球員最好不要向場主提及曾經或目前仍在玩的球場,惱怒的場主 可能對球員作出報復,如損毀球員的球具、球杆或球,或邀請更多球 員進場打球。 9 ,球員須善待球場,據聞最近在美國有球員濫用球場而遭惱怒的場 主剪斷其球杆,法庭後來判決場主無罪。 10 ,球場若為首度啟用,球員應特別小心。球杆太大者,更應動作放 輕放慢,以免場主不悅。 11 ,球場通常每月顧定保養一個星期,上紅漆補草。這段期間,最好 避免揮杆入洞,以免造成球員與場主間不必要的尷尬。球員若受不了 一定要揮杆,可以在場外用手搓揉球杆以及揮空杆,應可勉強解決球 員急欲揮杆的渴望。 12 ,球員欲試後洞者,最好事先與場主間協調,取得同意。 13 ,通常建議球員慢慢揮杆,但是球員得在場主之要求下,加速衝刺 揮杆。 14 ,球員的表現,由場主一人主觀判定。 15 ,經常更換球場揮杆的球員,最好在球杆外加裝保護套,以免球杆 受損。 16 ,若球員覺得忍不住想吐,一般皆須吐在砂地上方便清理,若與場 主有默契,或是沈溺於揮杆樂趣不可自拔者,得直接吐於球洞中。 17 ,揮杆結束離開球場,應清洗球杆並清理球場,最好再與場主寒喧 幾句,賓主盡歡,方得離場。" },

  { id:"sx463", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"你值得嗎?", a:"一個猶太姑娘回到家裏說: “媽,我結婚了。” 母親說: “噢,那太好啦!” 姑娘說: “可他是個阿拉伯人。” 母親說: “那可不太好啊。” 姑娘說: “但是,媽,他是一個阿拉伯酋⻑,富得讓你難以想像,我和 他結婚,你和爸爸就可以過上舒心的日子了。” 六個月後,姑娘又回到家中,說: “我愛阿拉伯酋⻑,但是,老天,他 整天就只知道幹我的屁眼兒,剛結婚時,我的屁眼兒只有一枚 10 美分 硬幣那麽大,現在已有一美金硬幣大啦。” 母親責怪說: “傻孩子,就為了 90 美分,值得你惹上這麻煩?”" },
  { id:"sx464", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"酒桌笑話", a:"有個局⻑請市⻑副市⻑們吃飯,席間局⻑站起來準備敬酒,這是一個 副市⻑說話了,他說我先說一個故事,你然後再敬酒。 副市⻑說:有一次一個實習的小護士在給病人做包皮切除手術時病人 的雞雞挺了起來,她怎麼也不能讓他軟下來,這是她趕快去喊來了護 士⻑,只見護士⻑到那裏不慌不忙的拿了一個酒精棉球,往病人的龜 頭上一擦,他的雞雞當時就軟了下去。 這時護士⻑說:就這麼一點酒量還想站起來???" },

  { id:"sx468", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"兩位傳教士", a:"兩位傳教士被非洲的一個食人部落抓住,被剝光了衣服放在一隻裝滿 水的大鍋裏,下面燃著熊熊大火。過了一會,其中一位傳教士突然大 笑起來。另一個傳教士簡直不敢相信這是真的,問道: “你怎麽啦?我 們正被活活烹煮,你竟還笑德出來!” 那位傳教士回答: “我剛剛在湯裏撒了一泡尿啊。”" },
  { id:"sx469", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"我給尿憋壞了", a:"計劃生育工作小組來到一個小山村,推行避孕節育措施,但醫生發現 很難說服這裏的女人們服用避孕藥丸,於是他們決定教男人戴安全 套。 有一個村⺠在八年裏生了八個孩子,醫生告訴他,他實在是要採取避 孕措施了,他對這個村⺠說,只要他戴安全套的話,他的老婆以後就 不會再生小孩了。 一個月後,工作小組發現,這個村⺠的老婆又懷孕了,醫生非常氣 憤,把那人叫來,問他為什麽沒有戴安全套。 這個村⺠答道: “我確確實實戴了,可是,過了六天,我給尿憋壞了, 只好把前面那部分剪掉啦。 “" },

  { id:"sx472", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"這就對了!", a:"兒子快要結婚,卻不知如何行周公之禮,便問父親該怎麽辦?父親含 糊地說: “到時候你在上面,她在下面就可以了。” 新婚之夜,新娘看見新床被改成上下鋪,生氣地將門反鎖,不讓新郎 進去,兒子在門口大叫: “爸爸呀!我進不去!” 父親回答: “用力呀!” 兒子於是用力一頂,膝蓋破皮流血了,不禁喊道: “啊!流血了!” 只聽父親在房內安心地說: “這就對了!”" },

  { id:"sx474", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"一個成年男人的日記", a:"7 月 1 日 我知道我不算帥哥,但曾經有人看我滿月的照片時,也說過我左邊的 鼻孔很偶像派。 7 月 2 日 獨守空房,讓人只能浪費;妻妾成群,讓人懂得節儉。可是我現在, 卻在終日浪費中嚮往節儉。 7 月 3 日 我想我是個變態,我有戀母和喜歡極品熟女的癖好。不然為什麼每次 看到我們超市主管的那張臉,我都想操她奶奶? 7 月 4 日 和女朋友分手之後,我終於明白,幸福要掌握在自己的手中,而不是 在別人的嘴裏! 7 月 5 日 今天看書,看到康熙皇帝在二十三歲的時候已經貴為一國之君,績偉 功豐,我很沮喪;但又看到同治皇帝在二十三歲時已經死了四年了, 我平飭恕? 7 月 6 日 以前喜歡過一個女孩,表白了,那女孩問我為什麼喜歡她,我說:如 果你是我,也會喜歡上你自己的。 後來,她把我拒絕了,我很傷心,她不瞭解我,我告訴她:如果我是 你,肯定早就喜歡上我自己了! 7 月 7 日 情人節,孤單的我在飯館吃面,聽到收音機裏的點歌節目說: “有一位 先生給所有戀人們點歌來表達他的祝福,下面請聽《無言的結 局》。”...... 我覺得很不好,人可以無愛,但不能無恥,於是我也打電話 點播了一首歌 —— 梁靜茹的《分手快樂》。 7 月 8 日 今天飯館的白酒又兌水了! ** !等我有錢了,也到大酒樓去喝人頭 馬、 XO 什麼的!而且絕對不讓他們用八六年和七二年的糊弄我,要喝 就來瓶今年的! 7 月 9 日 其實饅頭是萬能的,餓了就可以吃。想吃餅,就把饅頭拍扁;想吃麵 條,就把饅頭用梳子梳;想吃漢堡,就把饅頭切開夾菜吃 ...... 7 月 10 日 男人,上半身是修養,下半身是本質;女人,上半身是誘餌,下半身 是陷阱。 7 月 11 日 單身很痛苦,單身久了更痛苦,前幾天我看見一頭母豬,都覺得它眉 清目秀的 ........." },

  { id:"sx476", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"包裝都沒拆呢", a:"小李出了車禍,身上沒什麽傷,只有隱私部位的寶貝裂傷了些許,於 是醫師替他把那裏包紮好,說是一個星期便可痊癒。 兩天之後,是小齊的新婚大喜,洞房之夜,新娘以誘人之極的姿態緩 緩脫去衣服,當褪下胸罩時說:「小齊,親愛的,這裏是從沒被男人碰 過的。」 等她脫得一絲不掛時,用手掩住私處,說:「小齊,親愛的,這裏還是 原封,從來沒有男人進去過 ... 」小齊急忙脫下了衣褲,指著自己的寶 貝說: 「親愛的,你看,我這寶貝連包裝都還沒有拆呢!」" },

  { id:"sx478", src:"司馬怕光《性笑話大全4》", cat:"性笑話大全", q:"誰去買煙?", a:"蛇、螞蟻、蜘蛛、蜈蚣幾個人在家裏搓麻將。 8 圈之後,煙抽完了。 大家商量讓誰去買煙。 蛇說:我沒腳,我不去,讓螞蟻去。 螞蟻說:蜘蛛八隻腳,比我的多,讓蜘蛛去。 蜘蛛說:我的腳再多也比不過蜈蚣大哥呀,讓蜈蚣去吧。 蜈蚣無奈,心想:沒辦法,誰讓我腳多呢?於是蜈蚣出門去買煙 ...... 一個多鐘頭了,不見蜈蚣回來,兩個鐘頭後,還不見蜈蚣買煙回來。 於是大家讓蜘蛛出去看看,蜘蛛一出門就看見蜈蚣在門口坐著,蜘蛛 很生氣,問:你怎麼還不去呀?大家等著呢。 蜈蚣也急了,說道:廢話!你們總得等我穿好鞋吧!!!" },

  { id:"sx576", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"水手歸來", a:"有一個水手遠航歸來,實在是憋太久了,看到老婆就往她身上撲。 老婆剛剛和情夫溫存過了,實在是意興闌珊。 於是老婆說了: “不行啦!人家今天那個來了。” 水手很是掃興停止了動作 ...... 過了一會,他又興致勃勃地,想把老婆的身體翻過來。 這時老婆說道: “不行!不行!最近天氣熱,火氣大,人家痔瘡的毛病 又犯了啦!” 水手生氣的打了老婆一巴掌,說道: “賤人!如果你敢說你有扁桃腺發 炎的話,我就一腳把你踢出門去。”" },
  { id:"sx577", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"跟二奶的關係", a:"男士想跟二奶斷絕關係,二奶索要 20 萬青春損失費。 男士的父親很疼錢問: “青春損失費是什麼東西?” 二奶說: “跟你說,你也不懂!” 男士的父親問: “是不是折舊費?” 二奶說: “差不多。” 男士的父親說: “既然是折舊,俺孩子就沒有折舊。要是這樣的話,俺 還要跟你要磨損費呢?" },
  { id:"sx578", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"不要亂比喻哦", a:"有一個小孩子的爸爸很喜歡講粗口話,後來他的小孩子就問他爸: “爸 爸什麼是卵,什麼是逼呀?” 他一下情急的情況下就亂答: “鼻子是逼,嘴巴是卵”。後來有一天他爸帶他去吃飯,他看見他爸鼻子上面有一粒飯,他就 講:爸爸你的卵上面有一粒飯。 旁邊的一位小姐就大笑了起來,那位小孩子就講:阿爸你看那位阿姨 笑得逼都開了!!!!!!!!!" },
  { id:"sx579", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"全靠這張嘴", a:"一位原本要休假的阿兵哥打電話給她女友。 士兵: ” 明天我不能休假回去陪你了。連⻑要我幫他 ' 守營 '”。女友: ” 不要臉,這種話你也說的出口! ” 說完隨即掛斷電話,士兵一臉納悶,不過聽到女友這麼生氣,要是真 的不去,恐怕就要鬧兵變了,所以只好動用三寸不爛之舌向連⻑求 情,兩張終於答應讓士兵休假於是士兵趕緊有撥通電話給女友。 士兵: ” 剛剛守營的事已經解決了。 ” 女友: ” 怎麼這麼快? ” 士兵: ” 那還用說,全靠我這張嘴! ” 女友: ” ! @#%^&*()o" },
  { id:"sx580", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"太監的故事", a:"一皇帝出巡多年返京,忽聞一皇妃生子,心想:我在外這麼久,她怎 麼會懷孕生子,准是身旁太監所為。於是大怒召集所有太監,並令他 們排隊報數:1,2,3,4(太監的細聲),5(粗聲)。 “不用報了!” 皇上說, “把那個報5的關進死牢明天問斬!!” 夜過三更,那皇妃懷抱嬰兒偷入死牢,對報5的說: “我已買通牢役, 咱倆快逃,到一個誰也找不到的地方過幸福生活。” 報5的說: “來不及了,已經晚了(細聲的)。”" },
  { id:"sx581", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"媒體的力量", a:"有一隻母狼追趕一隻白色公兔,公兔從數杈間跳,母狼緊隨其後。很 不幸,母狼被卡住了,公兔強姦母狼後迅速逃跑,母狼大怒掙脫後去 追公兔。 公免逃至一沼澤地邊,沼澤地邊有一躺椅,上有一報紙,已無路可 逃,公兔急中生智,在沼澤地邊打了個滾,變成一隻灰兔,然後躺到 椅子上,蓋上報紙,裝作遊客。 母狼追至沼澤地邊,不見白兔,便問灰兔見過白兔經過否? 灰兔掀開身上的報紙問: “是那只強姦了母狼的白兔嗎?” 母狼聽問,立即變得十分羞愧,說: “這麼快就見報了?”" },
  { id:"sx582", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"一夜做七次的經過", a:"有一個模特兒的經紀人無意中發現,這位模特兒竟然兼做「副業」,週 末去當應召女郎。 經紀人心生歹念,想「白玩」一下。模特兒說: “不行,我們只在工作 上有關係,不能白玩,你若想要,週末來,而且和一般客人一樣,不 能打折扣,每次一百美元。” 週末的晚上,經紀人和模特兒像情人一樣,吃了晚餐,便上床了。關 掉了燈光,拉上了窗簾。 經紀人很有男子氣概地做完了愛,對模特兒說: “抱歉,我要上洗手 間,我每次做完,都習慣上廁所。” 上完廁所,經紀人又上床,又搞了 一次。然後又去上洗手間,回來之後又上床,再搞一次。 一連搞到第七次,模特兒忍不住讚美道: “我真的不知道你的功夫這麼 好,體力這麼棒。我真幸運有你這樣的經紀人。” 床上的男人回答: “什麼經紀人?我只是個路人,你的經紀人在門口賣 票,五十美元做一次愛。”" },
  { id:"sx583", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"強盜的貞潔", a:"一天有一強盜闖進一家銀行,有兩女營業員。 一女營員驚恐的說: “你要幹什麼,想搶錢嗎?就算是強暴我也不 給!” 強盜說: “想的美。” 女營業員暈到在地。" },
  { id:"sx584", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"新婚妙對", a:"新婚之夜新娘對新郎說: ” 你是讀書的人我給你出一對如果對好了就上 床幹事否則就莫想幹。 ” 新郎說: ” 請出題 ” 新娘說: ” 柳黃金嫩梨花白雪香你愛不愛? ” 新郎對道: ” 洞裏乾坤大壺裏日月⻑你怕不怕。 ”" },
  { id:"sx585", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"你搞錯了", a:"某男去回教國家旅遊。有天晚上,到一家隱密的妓院,付了五百塊 錢,正準備大幹一場時,卻發現老鴇帶出來的是一個男人。 某男不悅道: “喂!這算什麽!” “先生,這裏是回教國家,五百塊錢只能玩男人” ,老鴇說道, “如果要 玩女人的話,至少要五萬塊!” 某男因為身上錢不夠,只好心不甘情不願的玩了。 幾天以後,某甲愈想愈不甘心,於是帶著五萬塊,再去一次,這一次 老鴇帶出來的就十足是個女人了,在帶她回去的過程中,經過一片樹 林,女的說她想上廁所,某甲答應,只見女的在月光之下,遠遠的樹 叢之中,撩起裙子,蹲了下來,可是此時某甲卻發現,在女的兩腿之 間,似乎有一個棒狀物,某甲大為光火,一個箭步沖上去,握住了那 個棒狀物,女的大驚道: “先生,你抓到我的 ......” 某男怒道: “抓到你的什麽?哼!你們這群騙子,老子今天已經付了五 萬塊,竟然還是拿一個男人來騙我,看我怎麽教訓你!” 女的唯唯諾諾道: “你 ...... 抓到了我的大便!”" },

  { id:"sx587", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"黃瓜的好處!", a:"1. 根據統計,小黃瓜的平均⻑度是 13.5 公分。 2. 小黃瓜放很多天都不會軟。 3. 小黃瓜不會在乎自己的尺寸。 4. 小黃瓜不會在乎你賺的錢比它多。 5. 小黃瓜總是保持六點,而不是六點半。 6. 在菜市場挑選小黃瓜時,你可以很容易就看出它是軟是硬。 7. 小黃瓜不會又急又緊張。 8. 小黃瓜不會在乎今天是這個月的第幾天。 9. 你不需要對小黃瓜說你很抱歉。 10. 使用小黃瓜不需要跑藥房。 11. 當你餓的時候可以把小黃瓜吃下去。 12. 小黃瓜從來不問: ” 怎麽樣? ”” 我的表現還好嗎? ” ” 有沒有來? ”... 13. 你可以很容易地把小黃瓜藏在冰箱裏。 14. 不管你年紀多大,你都可以找到新鮮的小黃瓜。 15. 你可以從任何一端開始吃小黃瓜。 16. 小黃瓜不會喜歡比較大小。 17. 小黃瓜天生就有顆粒。 18. 小黃瓜可吃又可玩。 19. 小黃瓜的 size 可以隨自己的高興隨時更換。" },
  { id:"sx588", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"不可能", a:"大牛和他老婆每次 ZA 後都會起紅疹,他一口咬定是他老婆身上的香水 惹的禍。 他老婆不甘示弱地反駁他說: “不可能,我跟別人在一起時,他們都沒 有起紅疹!”" },
  { id:"sx589", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"實習", a:"一大群女生到農場實習,農場主教大家擠牛奶,示範作完,教大家動 手親自試試。這時一個女生看到別人已經擠了小半筒而自己的只有一 點點,非常不解。農場主過來看看說:小姐,你不但擠錯了地方,而 且還選錯了牛。" },
  { id:"sx590", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"火車上", a:"說是有一日,某男與某女在火車上同乘一個軟臥鋪車箱中,且僅有他 們兩人。途中,男對女有挑逗之意,女不悅,恰男講其姓王。女便用 兩手叉起,做王八狀,問:是虎頭王,還是這個王。 男隨之問女:您貴姓? 女答:姓鐘。 男一聽有門,可以挑逗之。便問:是這個中? 說著左手食拇指圈起,右手食指插入左手拇食指所圈起的洞中。女大 怒,找來乘警,告男耍流氓。 警問:他如何耍流氓? 女將剛才之事敍述一番。 警質問男:為何如此? 男大呼冤枉,答:剛才她說自己姓中,我問她是不是姓這個中?說著 用左手食拇指圈起,右手食指橫放在左手食拇指圈起的洞上,比作 “中” 狀。 警問女:這沒有什麼呀? 女大急,怒駡男:你這個人怎麼這麼不誠實,有人的時候你插進去, 沒有人的時候你就擔在沿上。" },
  { id:"sx591", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"小姐與的哥", a:"一天,一位小姐打摩托車回家,到了以後小姐問 “大哥多少錢” ? 這位摩托車司機說: 5 元。 這位小姐說: “大哥你看我千人騎萬人壓,兩奶子抓這麼大,你就收 3 元吧。” 司機說 “大妹子,你看我串大街走小巷,雞雞卵子磨贈亮,你就給 5 元 吧。”" },
  { id:"sx592", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"十戒的作用", a:"兩位牧師每天都騎單車去上班,但有一天,其中一位牧師沒有騎單 車,於是另一位牧師就問他其中的原因,這位牧師說: ” 我也記不清 了,我想是被偷了吧。 ” 另一位牧師就告訴念十戒,當念到 ” 你不可盜 ” 時,就會有人承認偷竊 了。 第二天,兩個牧師又見面了,那個牧師的車找到了, ” 你的車找到了 啊,你是按我說的做的嗎? ” 一個牧師問。 失了車的牧師答道: ” 嗯,不全是吧,我確念了十戒,當念到 ” 你不可 淫 ” 時,我好像想起來我把車放到什麽地方了。 ”" },
  { id:"sx593", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"僧人的慾望", a:"某人問一僧人: “師傅戒色,難道真沒有慾望嗎? 僧人說:” 不瞞施主,我每個月下面都要硬三次”。某人: “這到還好,只硬三次”。僧人歎了口氣說: “唉!硬一次要硬十天哪!”" },
  { id:"sx594", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"你還在意她懷不懷孕", a:"有一位風塵女郎一日在外兜風,不料車子卻拋錨在荒蕪的農村 ...... 而 天色卻漸漸暗了起來,放眼望去附近似乎只有一戶人家,不得已只好 去借宿。 那戶人家的主人是個老農夫,有兩個不經世事的兒子,⻑的卻很俊 美。老農夫知道這個女人若住在這,那怕是一晚,兩個兒子的貞潔也 難保,於是,在答應女郎借住之前,先跟她約法三章,要她答應決不 對兩個兒子出手,依當時的情況。女郎也只能答應。 然而到了晚上女郎卻忍不住,到了農夫兒子的房間,並問他們說:你 們想瞭解快樂的真諦嗎?? 只見農夫的兩個清純兒子點了點頭,而女郎又說: “這太好了,不過我 不想在教完你們後懷孕,所以請你們帶保險套,如此這般 .....” 經過了一晚翻雲覆雨,第二天女郎快樂的離去 ... 時間飛逝 ... 過了二十年後,老農夫也去逝了,兩個兒子也都未娶妻而 相依為命,一日在作完一天的勞動後,哥哥若有所思的對弟弟說: “你 還記得二十年前,有曾經有一個女生教我們快樂的真諦 ..” 弟弟答: “當然,我這輩子都忘不了” 哥哥又說: “那你還在意她懷不懷孕嗎??” 弟弟想了一想說: “不在意了 ... 。” 哥哥慎重的說: “那 ... 我們一起把保險套拿下來吧!!”" },
  { id:"sx595", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"乘客褲襠", a:"一架載著兩百多名乘客的飛機平穩地飛行在高空。這時,廣播裏傳來 機⻑愉快的聲音: “女士們,先生們,我是你們的機⻑,歡迎大家乘做 我們的航班,我想告訴大家的是 ...... 啊!天哪!!” 他發出這聲恐怖的叫聲後,廣播裏就沒有聲音了。 所有的乘客都嚇話壞了,連空姐也害怕的說不出話來。過了一會,廣 播終於又響了,還是機⻑: “女士們先生們,對不起,方才讓大家受驚 了。這裏確實發生了一個小小的意外,但不是飛機,乘務員給我到咖 啡的時候,不小心把咖啡撒在了我的襯衣上,不信你們來看都濕透 了!” 這時,機艙裏響起一個乘客怒氣衝天的抱怨聲: “襯衫濕了算什麼,你 看看我的褲襠!!" },
  { id:"sx596", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"會發電", a:"一位電力公司的技工,被一萬伏特電流的電線電倒在地,經醫生治療 後,竟然奇跡般康復。 醫生說:恭喜你康復,但你這種病例不比尋常,我擔心有後遺症,所 以你每週都必須來醫院檢查。 於是技工每週都來檢查,身體也無任何異樣,只是似乎他有難言之 隱。醫生問:你是不是有事瞞著我呢?為了你的健康著想,你應該向 我坦白的。 技工吞吞吐吐的說:不是的醫生,我的身體並沒有什麼不對勁,只 是,晚上和我太太行房時,她 ...... 醫生問:有什麼問題嗎? 技工困惑的說:她到達高潮時, RF 都會發電。" },

  { id:"sx609", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"偏頭痛", a:"有一位事業有成的中年男性,一直為一件事所苦 ---- 就是他⻑年來都有 “偏頭痛” 的問題。於是他去看醫生,醫生診斷後告訴他: “你的頭痛是 因為睾丸的神經出了問題,如果要根治,必須割除它 ......” 這位中年男子考慮了很久,想到他的事業與財富,以及後半輩子的美 好生活,最後決定忍痛做手術(去勢)! 當他出院時,感覺到前所沒有的舒暢,因為他的頭不再疼痛了。於是 高興的回家。走著走著經過一家男飾店,他想想應該要有個全新的生 活,於是他走了進去。 櫃檯小姐:” 先生,買頂帽子吧,你應該戴 M 號的! “於是拿了一頂漂 亮的帽子給他試戴。男子對著鏡子看看,非常滿意,稱道:” 很準確, 我平常都是買 M 號的。 “小姐謙虛的說:” 這是我的專業 ......“櫃檯小姐又推薦:” 那麼,配一件襯衫吧!應該穿領口 15 號的! “男子穿上後果然非常和宜,稱讚小姐:” 你真厲害,我都是買 15 號的襯 衫! “櫃檯小姐又趁機推銷了一條⻑褲:” 那麼,再配一條⻑褲吧!你應該穿 42 英寸的! “男子再度讚歎她的眼力: “小姐,你實在太厲害了!連我穿的褲⻑都一 眼看出來!” 小姐謙虛的說: “沒辦法,這是我的專業 ......“最後沒什麼好推銷了,小 姐:” 不如再買一條內褲吧!看來你應該穿 L 號的!” 男子笑道: “哈哈 ...... 小姐,你終於看錯了,我從中學以來都是穿 S 號 的!” 沒想到小姐告訴他:” 如果⻑期穿 S 號,就會壓迫到蛋蛋(睾丸),如果 ⻑期壓迫到蛋蛋,你就會偏頭痛!所以換到 L 號就好了! “男子當場放聲痛哭 ........." },
