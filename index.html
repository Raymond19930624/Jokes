  { id:"sx687", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"借你的一用 ......", a:"一書生新婚之夜只顧自己讀書,不于新娘行房事。 新娘耐不住寂寞,便上前挑鬥書生。 書生卻一本正經的說: “你我父輩乃甚世之交(只不過是好友罷了), 我決不會於你做出這等苟且之事!!!” 新娘又好氣又好笑,只好自己躺在床上 ZIWEI 。朦朧之中見自己夫君 的一隻手伸了過來,大喜之時急忙閉上雙眼等待好事的發生。 但過了半天也不見動靜,睜開眼睛卻發現書生依舊在看書。新娘奇怪 的問: “你剛才 ......” 書生趕緊為自己解釋: “我用口水翻書看了半天,早已口乾舌燥;見你 這裏水源豐富,於是借你的一用 ......”" },
  { id:"sx688", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"吃你呀!", a:"有一對新婚夫妻,早上老公要上班,出門前老婆問老公:『今天下班晚 餐要吃什堋?』 老公在老婆耳旁輕聲的說:『吃你呀!』說完便出門上班去了。 晚上老公下班回家,一開門就看到老婆赤裸裸的在客廳奔跑,老公不 解的問:『老婆你在幹什麼?』 『我在熱菜呀!』" },
  { id:"sx689", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"親授房中之術", a:"一女新婚,不懂男女之事,新郎無奈。三天回娘家,求于岳母調教。 岳母留女子在家,晚上親授房中之術,女子仍然不解,只好和老伴現 場演示,告之如法行事。 隔日,女士哭泣歸家。母問何故,答:父親只是用二個球球在你的外 面來回搓搓,我的丈夫卻用個肉棍戳進我的裏邊,都出血了,再也不 回去了 ...... 。" },
  { id:"sx690", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"新婚頭四夜", a:"新婚夫妻頭四天夜裏睡覺像四個字,” 老黃在臨下班之前大發高論。 第一夜像 ‘非’ 字,所謂羞羞答答,所以背向而臥。 第二夜像 ‘羽’ 字,新郎畢竟臉皮較厚。 第三夜像 ‘臼’ 字,新娘已不像頭兩夜那麼害羞了,因而已有相就之意。 第四夜像 ‘日’ 字,左右上下密不通風,足證明情好纏綿了。”" },
  { id:"sx691", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"我的職業 ......", a:"一位身材高窕的漂亮小姐說笑話,她說:請大家猜一猜我的職業 ...... 謎題是:每天上班就脫衣服,整天在扭腰擺屁股,還時常要把兩腿張 開 ...... 正當車上其他人面紅耳赤的時候,謎底揭曉了,那就是: “瑜珈 老師” 。" },
  { id:"sx692", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"殘障年金", a:"有一個年紀比較大的阿公,最近有一些社會福利團體發放老人年金, 阿公就去領老人年金,結果身上沒有帶證件 ... 小姐問阿公:「那你又沒有帶證件,我怎麼知道你幾歲呢?」 阿公說:「我有胸毛,胸毛全部白了,可以證明我年齡大概幾歲!」 他就脫衣服露胸毛給小姐看 ... 真的是很白,小姐就給他老人年金。 阿公回去就很驕傲和他太太講:「看!我今天多機智啊!脫衣服給小姐 看我的胸毛以後啊,她就給我老人年金耶!」 結果他太太不屑的跟他講說:「你應該脫褲子給她看,你還可以領『殘 障年金』呢!" },
  { id:"sx693", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"請問貴公司還缺人嗎", a:"一位男作家在雜誌辟一專欄,專門為讀者解決一些生活上的難題。 一日,有位讀者投書:我是一家女鞋店的男店員,我有一件非常困擾 的事,不知如何解決。因為我所服務的那家鞋店生意非常興隆,每天 從早到晚,顧客總是川流不息,所以我必須每天蹲著為客人試鞋。雖 然這只是件芝麻小事,但是你知道嗎?有許多女客人根本就不穿內 褲,所以每當我為她試鞋時,總會瞧見那不該瞧見的東西。這真使我 心跳急促,面紅耳赤,每次都有一股想要去摸撫它的衝動,你說我該 怎麼辦? 這位作家的答復是: “請問貴公司還缺人嗎?”" },

  { id:"sx696", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"兩個修女", a:"有兩個修女,一個是叫做數學修女,另一個則是叫邏輯修女。現在已 經快天黑了但她們離修道院還有很遠的路程。 數學:你有沒有注意到,後面有個男人已經跟蹤我們有三十八分鐘三 十秒了,不知道他想要做什麼? 邏輯:這很合理的,他想侵犯我們。 數學:天哪!在這樣的速度下,他會在十五分鐘之內抓到我們的,我 們該怎麼辦? 邏輯:唯一合理的方法當然是走快一點。 數學:好像沒用呀! 邏輯:當然沒用,那個男人也很合理的越走越快。 數學:那我們該怎麼辦?在這樣的速度下,他還有一分鐘就能抓到我 們了。 邏輯:唯一合理的方法就是我們分開逃,走那邊,我走這邊,他不可 能兩個都抓。 那個男人繼續跟蹤邏輯修女。 數學修女平安地到達修道院,但很擔心邏輯修女會不會出事,然後就 看到邏輯修女進了門口。 數學:邏輯修女你終於回來啦!感謝主!快告訴我發生什麼事了? 邏輯:發生了唯一合理的事情,那個男人不能兩個都跟蹤,所以他就 來追我。 數學:對對,但後來發生什麼事? 邏輯:發生了唯一合理的事情,我用盡全力地跑,他也用盡全力地在 後面追。 數學:然後呢? 邏輯:發生了唯一合理的事情,他抓到我了。 數學:天哪!那怎麼辦? 邏輯:我做了唯一合理的事,把裙子拉起來。 數學:天哪,邏輯修女!那個男人呢? 邏輯:他做了唯一合理的事,他把褲子拉了下去。 數學:我的天哪!那後來呢? 邏輯:不是很合理嗎,數學修女,一個把裙子拉起來的修女,一定跑 得比一個把褲子拉下去的男人快得多!!!" },

  { id:"sx700", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"怎麼,你想二婚", a:"那晚,有一場歐洲足球賽事將在淩晨 2 時現場直播,作為球迷,不容 錯過。可我又不能一直等到那時候,想先睡一會兒,於是我告訴老婆 到時候千萬要叫醒我。 老婆說: “球賽一般會在第二天重播,何必為了看直播而耽擱休息 呢?” 我拿眼瞪她: “直播好比頭婚,重播好比二婚,你說我該看直播還是該 看重播?” 老婆不吱聲了。 睡得正香,突然被老婆掐醒: “快起來,球賽開始了。” 當時我睡意正濃,就說: “還是明天看重播吧!” 老婆一把擰住我的耳朵,厲聲道: “怎麼,你想二婚?”" },
  { id:"sx701", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"激情彭湃的電話", a:"一個男人在無聊的時候,踢到一張紙,上面寫著一個色情電話,於是 他就打了這個電話。 女(拿起電話):喂,你好!我是激情小辣妹,從現在起你的一切感官 技能都會因我而澎湃!讓我們一起想入非非吧!你溫暖的雙手解開我 的第一顆紐扣!嘟 ...... 以下有馬賽克干擾,如果你要消除馬賽克干擾 請按一,如果不要請按二! 男:哇靠!連色情電話都有馬賽克!?太誇張了吧?好吧,既然都打 了,按一吧! 女:好,你按的是一,我們繼續吧。你溫暖的雙手解開我的第一顆紐 扣!嘟 ...... 以下為各種語言發音,如果你要中文請按一,如果你要英 文請按二,雙音請按九! 男:哇靠!這麼專業?還有多國語言?老子拼了,按一! 女:好,你按的是一,我們繼續吧。你溫暖的雙手解開我的第一顆紐 扣!而此時我非常的 ...... 嘟 ...... 現在員警臨檢中,我們強制斷線,請稍 後再撥。謝謝! 男:????" },
  { id:"sx702", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"我的下面和你不一樣", a:"暑假打工和同事玩遊戲,就是邊唱歌邊傳杯子,最後歌停時看杯子在 誰那裏,誰就要受罰的遊戲,現場只有我和一位女同事用免洗杯喝飲 料,於是就傳我們兩個的杯子,等到活動結束,我才想說:不對啊! 兩個人用的杯子都一樣,我怎麼知道哪個是我的? 只見那位高中剛畢業的美眉臉不紅氣不喘的說:沒關係,我的下面和 你不一樣!! 等到大家都笑翻了,她才無辜的說:對啊!我有壓扁做記號啊!" },
  { id:"sx703", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"所以小孩頭髮是褐色的", a:"『醫生,我和我太太都是黑髮,為什麼生下的小孩會是褐色頭髮呢?』 『你們每天都作愛嗎?』 『不。』 『每週作愛?』 『也不。』 『每月作愛嗎?』 『不是。』 『半年一次?』 『也不是。』 『一年只有一次?』 『差不多。』 『這就對了,你的寶貝生銹了,所以小孩的頭髮才會是褐色的。』" },
  { id:"sx704", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"真夭壽", a:"兩隻螞蟻連袂出遊,來到森林邊,甲螞蟻眼尖,發現雜草叢後有一山 洞,於是提議入內探險,乙螞蟻生性膽小,說道:你自己進去就好 了,我在外面幫你把風 ..... 甲螞蟻只得獨自深入洞穴一探究竟,沒想到才進入洞中沒一會兒,便 天搖地動起來,甲螞蟻在裏頭東跌西撞,只差沒要掉他的小命,最後 昏過去了,蘇醒之後,趕忙爬出洞外,尋找乙螞蟻,卻見乙螞蟻斷手 瘸腿的昏死在一旁,趕緊施以急救,才見乙幽幽轉醒。 乙問甲:發生了什麽事,你怎麽全身淤青還沾了一身的洗髮精? 甲說了:好倒楣,我才剛進去,就發生大地震,撞得我七昏八素的, 我就昏過去,其他的我就不知道了! 甲反問乙道:你在外頭,怎麽傷得比我還重???? 乙虛弱的說:你才一進去,外頭就來了一部越野車,我一時閃避不 及,被它的兩個大大輪胎壓住了,才落個如此下場,氣人的是,那部 車撞了我之後,居然沒有停下來查看,反而用輪胎反覆的在我身上輾 壓,存心致我於死地!!那部車的駕駛,真夭壽!!" },
  { id:"sx705", src:"司馬怕光《性笑話大全5》", cat:"性笑話大全", q:"驢和老虎", a:"話說山裏有一隻公驢和一隻男老虎,因為饑渴無比,把山裏除了他倆 以外的其他所有動物都給幹死了。後來,沒辦法,兩個傢伙湊到一塊 了,老虎商量著說:都沒東西幹了,不如我倆互相幹幹吧? 驢一聽,想,行,反正沒東西搞了,就說:好,你是百獸之王,你先 來幹我吧。 老虎一聽,得不得就搞了上去,驢子為了營造氣氛,扯開嗓子,吼的 震徹山谷啊,老虎從來沒聽過這樣的叫床聲,把老虎那個爽啊 ...... 一會,老虎幹完了,該驢了。驢話都沒說就狠狠的幹了下去,嘿休嘿 休的幹了半天,老虎氣都沒出,驢不願意了,隨便的幹完了,下來氣 喘吁吁的問老虎,說: “我說,老哥,你這也太沒意思了吧,你幹我的時候,我為了配合你, 那叫的,把你爽的!可輪到我了,你怎麼氣都不出呢?搞的人心裏是 哇涼哇涼的!” 老虎一聽,委屈的一臉的淚啊,說: “還說呢,兄弟,一說著眼淚就嘩嘩的,我咋不想叫了,可是總有一根 東西卡在我嗓子眼兒裏,我想叫叫不出來啊 ...... !!!”" },

// ── 收藏整理：避免評分時重複或近似 ────────────────────────────
// 保留原始資料與 ID，避免影響既有收藏／評分紀錄；只從評分佇列排除重複項。
const NEAR_DUPLICATE_IDS = new Set([
  'fs005','fs006','fs013','fs020','fs029','fs030','c020','t034','aa035'
]);

function normalizeJokeText(text){
  return String(text||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}]/gu,'');
}

function buildCuratedJokes(jokes){
  const seenQuestions=new Set();
  const seenJokes=new Set();
  return jokes.filter(joke=>{
    if(NEAR_DUPLICATE_IDS.has(joke.id)) return false;
    const question=normalizeJokeText(joke.q);
    const signature=`${question}|${normalizeJokeText(joke.a)}`;
    if(!question||seenQuestions.has(question)||seenJokes.has(signature)) return false;
    seenQuestions.add(question);
    seenJokes.add(signature);
    return true;
  });
}

const CURATED_JOKES = buildCuratedJokes(JOKES);

// ── API ───────────────────────────────────────────────────────
async function apiGet(action){
  const res = await fetch(`${API}?action=${action}&_=${Date.now()}`);
  return res.json();
}
async function apiPost(body){
  await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});
}

// ── 狀態 ──────────────────────────────────────────────────────
let liked=[], rejected=new Set(), queue=[], current=null, revealed=false;
let pendingSaves=0, currentTab='rate', filterCat='全部', rateCat='全部';
let sharedMap={}, shareFilter='all';

// ── 初始化 ────────────────────────────────────────────────────
async function init(){
  show('loading-msg'); hide('card-area'); hide('error-view'); hide('empty-view');
  try {
    const [likedData, rejectedData, sharedData] = await Promise.all([apiGet('getLiked'),apiGet('getRejected'),apiGet('getShared')]);
    sharedMap = sharedData||{};
    // normalize欄位名稱（防止Sheets回傳的key有空白或大小寫問題）
    liked = (likedData||[]).map(r=>({
      id: String(r.id||r.ID||'').trim(),
      cat: String(r.cat||r.CAT||'').trim(),
      q: String(r.q||r.Q||'').trim(),
      a: String(r.a||r.A||'').trim(),
      src: String(r.src||r.SRC||'').trim(),
    })).filter(r=>r.id);
    rejected = new Set((rejectedData||[]).map(s=>String(s).trim()));
    const likedIds = new Set(liked.map(j=>j.id));
    queue = CURATED_JOKES.filter(j=>!rejected.has(j.id)&&!likedIds.has(j.id));
    hide('loading-msg');
    updateUI();
    renderRateCats();
    showNext();
  } catch(e){
    hide('loading-msg'); show('error-view');
    document.getElementById('error-msg').innerHTML=
      '無法連到 Google Sheets<br><br>請確認：<br>1. 網路連線正常<br>2. Apps Script 存取權設為「任何人」<br><small style="color:#555">'+e.message+'</small>';
  }
}

// ── 顯示下一則 ────────────────────────────────────────────────
function showNext(){
  const card = document.getElementById('joke-card');
  card.classList.remove('swipe-right','swipe-left','swiping');
  card.style.transform='';
  document.getElementById('like-hint').style.opacity='0';
  document.getElementById('dislike-hint').style.opacity='0';

  if(queue.length===0){
    hide('card-area'); hide('vote-btns'); hide('swipe-hint');
    document.getElementById('empty-liked').textContent=liked.length;
    show('empty-view'); return;
  }
  current=queue[0]; revealed=false;
  document.getElementById('cat-tag').textContent=current.cat;
  const sourceTag=document.getElementById('src-tag');
  sourceTag.replaceChildren('來源：');
  if(current.url){
    const sourceLink=document.createElement('a');
    sourceLink.href=current.url;
    sourceLink.target='_blank';
    sourceLink.rel='noopener noreferrer';
    sourceLink.textContent=current.src;
    sourceTag.append(sourceLink);
  }else{
    sourceTag.append(current.src);
  }
  document.getElementById('joke-q').textContent=current.q;
  document.getElementById('joke-a').textContent='👉 '+current.a;
  document.getElementById('joke-a').style.display='none';
  document.getElementById('reveal-btn').style.display='block';
  document.getElementById('vote-btns').style.display='none';
  hide('empty-view');
  show('card-area');
  show('swipe-hint');
  updateStatus();
}

function revealAnswer(){
  if(!current) return;
  document.getElementById('joke-a').style.display='block';
  document.getElementById('reveal-btn').style.display='none';
  document.getElementById('vote-btns').style.display='flex';
  revealed=true;
}

function vote(isLike){
  if(!current) return;
  const card=document.getElementById('joke-card');
  card.classList.add(isLike?'swipe-right':'swipe-left');
  const j=current; queue=queue.slice(1);
  if(isLike) liked.push(j); else rejected.add(j.id);
  updateUI();
  pendingSaves++;
  updateStatus();
  const body=isLike?{action:'like',joke:j}:{action:'reject',id:j.id};
  apiPost(body).catch(()=>{}).finally(()=>{pendingSaves--;updateStatus();});
  setTimeout(()=>showNext(),300);
}

function updateStatus(){
  const el=document.getElementById('queue-status');
  if(!el) return;
  const sync=pendingSaves>0?'<span style="color:#ffe135;font-size:.7rem">☁ 同步中…</span>':'<span style="color:#333;font-size:.7rem">✓ 已同步</span>';
  el.innerHTML=`佇列還有 ${queue.length} 則待評 · ${sync}`;
}

// ── 滑動手勢 ──────────────────────────────────────────────────
let touchStartX=0, touchStartY=0, isDragging=false, dragX=0;
const SWIPE_THRESHOLD=80;

function setupSwipe(){
  const card=document.getElementById('joke-card');

  card.addEventListener('touchstart',e=>{
    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;
    isDragging=false; dragX=0;
    card.classList.add('swiping');
  },{passive:true});

  card.addEventListener('touchmove',e=>{
    if(!current||!revealed) return;
    const dx=e.touches[0].clientX-touchStartX;
    const dy=e.touches[0].clientY-touchStartY;
    if(!isDragging&&Math.abs(dy)>Math.abs(dx)) return; // 垂直滑動不攔截
    isDragging=true;
    dragX=dx;
    const rot=dx*0.08;
    card.style.transform=`translateX(${dx}px) rotate(${rot}deg)`;
    const progress=Math.min(Math.abs(dx)/SWIPE_THRESHOLD,1);
    document.getElementById('like-hint').style.opacity=dx>0?progress:0;
    document.getElementById('dislike-hint').style.opacity=dx<0?progress:0;
  },{passive:true});

  card.addEventListener('touchend',()=>{
    if(!isDragging){ card.classList.remove('swiping'); return; }
    card.classList.remove('swiping');
    if(dragX>SWIPE_THRESHOLD&&revealed) vote(true);
    else if(dragX<-SWIPE_THRESHOLD&&revealed) vote(false);
    else{
      card.style.transform='';
      document.getElementById('like-hint').style.opacity='0';
      document.getElementById('dislike-hint').style.opacity='0';
    }
    isDragging=false; dragX=0;
  });

  // 鍵盤支援
  document.addEventListener('keydown',e=>{
    if(!current) return;
    if(e.key==='ArrowRight'&&revealed) vote(true);
    if(e.key==='ArrowLeft'&&revealed) vote(false);
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!revealed)revealAnswer();}
  });
}

// ── UI ────────────────────────────────────────────────────────
function updateUI(){
  const pct=Math.min(liked.length/TARGET*100,100);
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('liked-count').textContent='已收藏 '+liked.length+' 則';
  document.getElementById('tab-collection').textContent='📚 收藏（'+liked.length+'）';
}


function renderRateCats(){
  const allCats=['全部',...new Set(CURATED_JOKES.map(j=>j.cat))];
  const el=document.getElementById('rate-cats');
  if(!el) return;
  el.innerHTML=allCats.map(c=>
    `<button class="cat-filter${c===rateCat?' active':''}" onclick="setRateCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
}

function setRateCat(c){
  rateCat=c;
  const likedIds=new Set(liked.map(j=>j.id));
  const remaining=CURATED_JOKES.filter(j=>!rejected.has(j.id)&&!likedIds.has(j.id));
  queue=rateCat==='全部'?remaining:remaining.filter(j=>j.cat===rateCat);
  renderRateCats();
  showNext();
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='rate')||(i===1&&tab==='collection')));
  if(tab==='rate'){
    document.getElementById('rate-view').style.display='flex';
    document.getElementById('collection-view').style.display='none';
  } else {
    document.getElementById('rate-view').style.display='none';
    document.getElementById('collection-view').style.display='flex';
    document.getElementById('collection-view').style.height='';
    renderCollection();
  }
}

function renderCollection(){
  const cats=['全部',...new Set(CURATED_JOKES.map(j=>j.cat))];
  document.getElementById('collection-cats').innerHTML=cats.map(c=>
    `<button class="cat-filter${c===filterCat?' active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');

  let filtered=filterCat==='全部'?liked:liked.filter(j=>j.cat===filterCat);
  if(shareFilter==='unshared') filtered=filtered.filter(j=>!sharedMap[j.id]);
  if(shareFilter==='shared') filtered=filtered.filter(j=>!!sharedMap[j.id]);

  const grid=document.getElementById('collection-grid');
  if(liked.length===0){grid.innerHTML='<div id="no-collection">還沒有收藏，去評分吧！</div>';return;}
  if(filtered.length===0){grid.innerHTML='<div id="no-collection">這個分類沒有笑話</div>';return;}

  grid.innerHTML=filtered.map(j=>{
    const isShared=!!sharedMap[j.id];
    const sharedDate=sharedMap[j.id]||'';
    const copyText=j.q+'\n\n👉 '+j.a;
    return `
    <div class="joke-card-col${isShared?' shared':''}" id="jc-${j.id}">
      <div class="jcat">${j.cat} · ${j.src||''}${isShared?` · <span style="color:#55cc55;font-size:0.62rem">✅ ${sharedDate}</span>`:''}</div>
      <div class="jq">${j.q.replace(/\n/g,'<br>')}</div>
      <div class="ja">👉 ${j.a}</div>
      <div class="joke-actions">
        <button class="btn-copy" onclick="copyJoke('${j.id}',this)" data-text="${encodeURIComponent(copyText)}">📋 複製</button>
        <button class="btn-share${isShared?' shared':''}" onclick="toggleShare('${j.id}',this)">
          ${isShared?'✅ 已分享':'📤 標記分享'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function setCat(c){filterCat=c;renderCollection();}

function setShareFilter(f){
  shareFilter=f;
  ['all','unshared','shared'].forEach(x=>{
    const el=document.getElementById('sf-'+x);
    if(el) el.classList.toggle('active',x===f);
  });
  renderCollection();
}

function copyJoke(id, btn){
  const text=decodeURIComponent(btn.dataset.text);
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✅ 已複製！';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 複製';btn.classList.remove('copied');},2000);
  }).catch(()=>{
    // fallback
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent='✅ 已複製！'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 複製';btn.classList.remove('copied');},2000);
  });
}

function toggleShare(id, btn){
  const isShared=!!sharedMap[id];
  const card=document.getElementById('jc-'+id);
  if(isShared){
    delete sharedMap[id];
    btn.textContent='📤 標記分享'; btn.classList.remove('shared');
    if(card){ card.classList.remove('shared');
      const cat=card.querySelector('.jcat');
      if(cat) cat.innerHTML=cat.innerHTML.replace(/·\s*<span[^>]*>.*?<\/span>/,'');
    }
    apiPost({action:'unshare',id}).catch(()=>{});
  } else {
    const today=new Date().toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});
    sharedMap[id]=today;
    btn.textContent='✅ 已分享'; btn.classList.add('shared');
    if(card){ card.classList.add('shared');
      const cat=card.querySelector('.jcat');
      if(cat && !cat.querySelector('span')) cat.innerHTML+=` · <span style="color:#55cc55;font-size:0.62rem">✅ ${today}</span>`;
    }
    apiPost({action:'share',id,date:today}).catch(()=>{});
  }
  if(shareFilter!=='all') setTimeout(()=>renderCollection(),800);
}
function show(id){const el=document.getElementById(id);if(el)el.style.display='';}
function hide(id){const el=document.getElementById(id);if(el)el.style.display='none';}

setupSwipe();
init();
</script>
